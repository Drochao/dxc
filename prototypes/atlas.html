<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>素材图鉴 · Art Atlas</title>
<style>
  :root {
    --ink: #1b1210;
    --bg: #100b09;
    --panel: #1d1512;
    --panel-2: #251a15;
    --line: #3a2a20;
    --gold: #c99a62;
    --gold-dim: #8a6a44;
    --text: #d8c3a5;
    --text-dim: #8b7660;
    --text-faint: #6a5842;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(circle at 50% 0%, #2a1d16 0%, #0b0807 62%) fixed,
      #0b0807;
    color: var(--text);
    font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 0 24px 80px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }

  /* ── 页头 ── */
  header {
    padding: 64px 0 40px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 8px;
  }
  header h1 {
    margin: 0 0 10px;
    font-family: Georgia, "Songti SC", "Times New Roman", serif;
    font-size: 40px;
    font-weight: 400;
    letter-spacing: .02em;
    color: #eddcbe;
  }
  header h1 em {
    font-style: normal;
    color: var(--gold);
  }
  header p {
    margin: 0;
    font-size: 13px;
    letter-spacing: .22em;
    color: var(--text-faint);
    text-transform: uppercase;
  }
  .stats {
    display: flex; flex-wrap: wrap; gap: 34px;
    margin-top: 30px;
  }
  .stat b {
    display: block;
    font-size: 22px; font-weight: 500;
    color: var(--gold); letter-spacing: .02em;
  }
  .stat span {
    font-size: 11px; letter-spacing: .18em;
    color: var(--text-faint); text-transform: uppercase;
  }

  /* ── 分组 ── */
  section { margin-top: 56px; }
  section > h2 {
    display: flex; align-items: center; gap: 14px;
    margin: 0 0 22px;
    font-size: 12px; font-weight: 500;
    letter-spacing: .3em; text-transform: uppercase;
    color: var(--gold-dim);
  }
  section > h2::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--line), transparent);
  }
  section > h2 i {
    font-style: normal; color: var(--text-faint);
    letter-spacing: .1em; font-size: 11px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(226px, 1fr));
    gap: 16px;
    align-items: start;
  }
  .grid .wide { grid-column: span 2; }

  /* ── 卡片 ── */
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 2px;
    overflow: hidden;
    transition: border-color .2s, transform .2s, box-shadow .2s;
  }
  .card:hover {
    border-color: var(--gold-dim);
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(0, 0, 0, .55);
  }
  .stage {
    display: flex; align-items: flex-end; justify-content: center;
    height: 252px;
    padding: 20px 12px 10px;
    background:
      radial-gradient(circle at 50% 78%, rgba(201, 154, 98, .10) 0%, transparent 62%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 4px);
    border-bottom: 1px solid rgba(58, 42, 32, .6);
  }
  .stage canvas {
    display: block;
    max-width: 100%;
    max-height: 100%;
    image-rendering: pixelated;
    filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .5));
  }
  .info { padding: 13px 14px 15px; }
  .info h3 {
    margin: 0;
    font-size: 14px; font-weight: 500; color: #eddcbe;
    display: flex; align-items: baseline; gap: 7px;
  }
  .info h3 span {
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--text-faint);
  }
  .info code {
    display: inline-block; margin: 7px 0 0;
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 10.5px; color: #a9752f;
    background: rgba(201, 154, 98, .07);
    padding: 2px 6px; border-radius: 2px;
  }
  .info .size {
    margin: 6px 0 0; font-size: 10.5px;
    color: var(--text-faint); letter-spacing: .04em;
  }
  .info p.desc {
    margin: 9px 0 0;
    font-size: 11.5px; line-height: 1.75;
    color: #a4907a;
  }
  .dots { display: flex; gap: 5px; margin-top: 11px; }
  .dots i {
    width: 13px; height: 13px; border-radius: 2px;
    background: var(--c);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .45);
  }

  /* ── 调色板 ── */
  .swatches {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
  }
  .sw {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 2px;
    overflow: hidden;
  }
  .sw .chip {
    height: 46px;
    box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .4);
  }
  .sw .meta { padding: 8px 10px 10px; }
  .sw b {
    display: block; font-size: 11px; font-weight: 500;
    color: #cfb994; letter-spacing: .04em;
  }
  .sw code {
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 10px; color: var(--text-faint);
    text-transform: uppercase;
  }

  /* ── 手法说明 ── */
  .techs { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
  .tech {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-left: 2px solid var(--gold-dim);
    padding: 14px 16px;
  }
  .tech b {
    display: block; font-size: 12px; color: #e0c89e;
    letter-spacing: .06em; margin-bottom: 6px;
  }
  .tech code {
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 10.5px; color: #a9752f;
  }
  .tech p {
    margin: 7px 0 0; font-size: 11.5px; line-height: 1.75; color: #a4907a;
  }

  .notice {
    margin-top: 26px; padding: 16px 18px;
    background: rgba(192, 57, 43, .07);
    border: 1px solid rgba(192, 57, 43, .3);
    border-left: 2px solid #c0392b;
    font-size: 12px; line-height: 1.8; color: #c9a999;
    display: none;
  }
  .notice code {
    font-family: "Cascadia Code", Consolas, monospace;
    color: #e0a878; background: rgba(0,0,0,.3); padding: 1px 5px;
  }
  footer {
    margin-top: 64px; padding-top: 22px;
    border-top: 1px solid var(--line);
    font-size: 11px; color: var(--text-faint);
    letter-spacing: .08em;
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  iframe { position: fixed; left: -9999px; top: 0; width: 960px; height: 540px; border: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>素材图鉴 · <em>Art Atlas</em></h1>
    <p>Act I 海滩 · Act II 莲地 · Act III 洞窟 — 手绘风素材清单</p>
    <div class="stats">
      <div class="stat"><b id="n-items">—</b><span>绘制单元</span></div>
      <div class="stat"><b id="n-colors">—</b><span>调色板色</span></div>
      <div class="stat"><b>480 × 270</b><span>逻辑分辨率</span></div>
      <div class="stat"><b>2×</b><span>渲染倍率</span></div>
    </div>
    <div class="notice" id="notice">
      图鉴需要读取同目录的 <code>proto-hand.html</code> 里的绘制函数，直接双击打开会被浏览器的同源策略拦住。<br>
      请在本目录起一个本地服务器再访问：<code>npx serve .</code> 或 <code>python -m http.server</code>
    </div>
  </header>
  <div id="sections"></div>
  <footer>
    <span>所有图形由原型实时绘制，改 proto-hand.html 后刷新本页即同步</span>
    <span>手绘三手法：粗黑描边 · 确定性抖动 · 材质分层</span>
  </footer>
</div>

<iframe id="kit" src="proto-hand.html"></iframe>
<canvas id="bench"></canvas>

/* ── 绘制手法 ───────────────────────────────── */
const TECHS = [
  ['ink(build, fill, lw)', '统一描边', '所有形状先填色、再用同一支黑笔压边。描边宽度随物件体量在 0.9~2.8 之间变化，这是整套画风的粘合剂。'],
  ['jit(i) / sj(i)', '确定性抖动', '用 sin 哈希生成 -1~1 的固定随机数。手绘的“歪”每帧稳定不变，不会抽搐成噪点。'],
  ['innerLight(cx, cy, rx, ry, color, alpha)', '内叠光', '裁剪进形状内部再叠一层椭圆亮部，不画渐变也能拉出体积。'],
  ['shadow(cx, cy, rx, ry, a)', '落地阴影', '角色脚下压一层椭圆暗影，让扁平贴纸站得住地面。']
];

/* ── 构建 DOM ───────────────────────────────── */
const sectionsEl = document.getElementById('sections');
const groups = [];
ITEMS.forEach(function (it) {
  let g = groups.find(function (x) { return x.name === it.group; });
  if (!g) { g = { name: it.group, items: [] }; groups.push(g); }
  g.items.push(it);
});

groups.forEach(function (g) {
  const sec = document.createElement('section');
  const h2 = document.createElement('h2');
  h2.innerHTML = g.name + '<i>' + g.items.length + '</i>';
  sec.appendChild(h2);
  const grid = document.createElement('div');
  grid.className = 'grid';

  g.items.forEach(function (it) {
    const card = document.createElement('article');
    card.className = 'card' + (it.wide ? ' wide' : '');
    card.dataset.key = it.key;

    const stage = document.createElement('div');
    stage.className = 'stage';
    const cv = document.createElement('canvas');
    cv.width = Math.round(it.box[2] * it.zoom);
    cv.height = Math.round(it.box[3] * it.zoom);
    stage.appendChild(cv);

    const info = document.createElement('div');
    info.className = 'info';
    info.innerHTML =
      '<h3>' + it.name + '<span>' + it.en + '</span></h3>' +
      '<code>' + it.fn + '</code>' +
      '<p class="size">' + it.size + '</p>' +
      '<p class="desc">' + it.desc + '</p>' +
      '<div class="dots">' + it.dots.map(function (c) {
        return '<i style="--c:' + c + '"></i>';
      }).join('') + '</div>';

    card.appendChild(stage);
    card.appendChild(info);
    card._spec = it;
    card._canvas = cv;
    grid.appendChild(card);
  });

  sec.appendChild(grid);
  sectionsEl.appendChild(sec);
});

/* 调色板 */
(function () {
  const sec = document.createElement('section');
  sec.innerHTML = '<h2>调色板<i>' + PALETTE.length + '</i></h2>';
  const box = document.createElement('div');
  box.className = 'swatches';
  sec.appendChild(box);
  sectionsEl.appendChild(sec);
  sec._box = box;

  /* 占位，等原型就绪后填真实色值 */
  window.__paletteSlot = box;
})();

/* 手法 */
(function () {
  const sec = document.createElement('section');
  sec.innerHTML = '<h2>绘制手法<i>3</i></h2>';
  const box = document.createElement('div');
  box.className = 'techs';
  TECHS.forEach(function (t) {
    const d = document.createElement('div');
    d.className = 'tech';
    d.innerHTML = '<b>' + t[1] + '</b><code>' + t[0] + '</code><p>' + t[2] + '</p>';
    box.appendChild(d);
  });
  sec.appendChild(box);
  sectionsEl.appendChild(sec);
})();

document.getElementById('n-items').textContent = ITEMS.length;
document.getElementById('n-colors').textContent = PALETTE.length;

/* ── 从原型取绘制函数并实时渲染 ───────────────── */
const frame = document.getElementById('kit');
let A = null;
const AX = 240, AY = 142;   // 原型画布上的锚点（逻辑坐标）

function init() {
  A = frame.contentWindow && frame.contentWindow.__atlas;
  if (!A) return;

  /* 填真实色值 */
  const box = window.__paletteSlot;
  PALETTE.forEach(function (p) {
    const hex = A.palette[p[0]];
    if (!hex) return;
    const d = document.createElement('div');
    d.className = 'sw';
    d.innerHTML =
      '<div class="chip" style="background:' + hex + '"></div>' +
      '<div class="meta"><b>' + p[1] + '</b><code>' + hex + '</code>' +
      '<div style="font-size:10px;color:#5e4d3c;margin-top:4px;line-height:1.5">' + p[2] + '</div></div>';
    box.appendChild(d);
  });

  const cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
  let lastDraw = 0;

  function tick(now) {
    requestAnimationFrame(tick);
    if (now - lastDraw < 33) return;   // 约 30fps，够看呼吸和摆动
    lastDraw = now;
    const tt = now / 1000;

    cards.forEach(function (card) {
      const s = card._spec;
      const cv = card._canvas;
      const g = cv.getContext('2d');

      A.reset(tt);
      (s.pre || []).forEach(function (k) { A.items[k](); });
      if (s.full) {
        A.items[s.key]();
      } else {
        A.items[s.key](AX, AY);
      }

      const sx = s.full ? s.box[0] : AX + s.box[0];
      const sy = s.full ? s.box[1] : AY + s.box[1];

      g.imageSmoothingEnabled = s.zoom < 1;   // 缩小用平滑，放大保留硬像素
      g.clearRect(0, 0, cv.width, cv.height);
      g.drawImage(
        A.cvs,
        Math.round(sx * A.RS), Math.round(sy * A.RS),
        Math.round(s.box[2] * A.RS), Math.round(s.box[3] * A.RS),
        0, 0, cv.width, cv.height
      );
    });
  }
  requestAnimationFrame(tick);
}

frame.addEventListener('load', init);

setTimeout(function () {
  try {
    if (!A || !frame.contentWindow.__atlas) throw new Error('blocked');
  } catch (e) {
    document.getElementById('notice').style.display = 'block';
  }
}, 2500);
</script>
