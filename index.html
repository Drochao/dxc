<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/png" href="icon.png" />
<title>ODYSSEY · 归乡</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: #090b11;
    color: #c9d4e6;
    font-family: ui-monospace, "Cascadia Mono", "Courier New", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 26px 20px 34px;
    background-image:
      radial-gradient(circle at 50% -10%, rgba(78, 118, 200, 0.16), transparent 58%),
      radial-gradient(circle at 50% 110%, rgba(190, 86, 60, 0.08), transparent 55%);
  }
  .wrap { width: min(1320px, 100%); }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
    gap: 12px;
  }
  .title { font-size: 13px; letter-spacing: 0.34em; color: #7e93b5; }
  .title b { color: #edf3ff; font-weight: 700; }
  .tag { font-size: 10px; letter-spacing: 0.16em; color: #56647c; white-space: nowrap; }

  .screen {
    position: relative;
    padding: 10px;
    background: #05070c;
    border: 1px solid #29324a;
    box-shadow:
      0 0 0 1px #0a0e17,
      0 26px 70px rgba(0, 0, 0, 0.75),
      inset 0 0 70px rgba(92, 132, 205, 0.07);
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .scan {
    position: absolute;
    inset: 10px;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.14) 0px,
      rgba(0, 0, 0, 0.14) 1px,
      rgba(0, 0, 0, 0) 1px,
      rgba(0, 0, 0, 0) 3px
    );
  }
  .story {
    margin: 12px 0 0;
    font-size: 11px;
    line-height: 1.8;
    color: #64748e;
    letter-spacing: 0.02em;
  }
  .story b { color: #a6b7cf; font-weight: 600; }

  .meta {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 8px;
    margin-top: 14px;
  }
  .item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border: 1px solid #1c2434;
    background: rgba(16, 21, 32, 0.72);
    font-size: 11px;
    letter-spacing: 0.04em;
  }
  .item b { color: #8fa8cc; font-weight: 600; }
  .item span { color: #5c6b84; font-size: 10px; text-align: right; }

  /* 桌面客户端模式：隐藏网页说明，让画面铺满窗口 */
  body.app {
    padding: 10px;
    background-image: none;
  }
  body.app .topbar,
  body.app .story,
  body.app .meta { display: none; }
  body.app .wrap { width: min(100%, calc((100vh - 40px) * 1.7778 + 20px)); }
  body.app .screen { padding: 8px; }
  body.app .scan { inset: 8px; }
</style>
</head>
<body>
<script>if (location.search.indexOf('app=1') !== -1 || navigator.userAgent.indexOf('Electron') !== -1) document.body.className = 'app';</script>
<div class="wrap">
  <div class="topbar">
    <div class="title">HOMER'S <b>ODYSSEY</b></div>
    <div class="tag">CANVAS DEMO · 480 × 270</div>
  </div>

  <div class="screen">
    <canvas id="game" width="960" height="540"></canvas>
    <div class="scan"></div>
  </div>

  <p class="story">
    取材自荷马史诗《奥德赛》：特洛伊战后，奥德修斯洗劫伊斯马罗斯，被援军赶回海上；
    随后漂到食莲人之地，再闯入独眼巨人的洞窟。三幕各有首领镇守。
  </p>

  <div class="meta">
    <div class="item"><b>移动</b><span>WASD / 方向键</span></div>
    <div class="item"><b>射箭</b><span>J / 空格</span></div>
    <div class="item"><b>挥剑</b><span>L</span></div>
    <div class="item"><b>格挡</b><span>K / Shift · 消耗体力</span></div>
    <div class="item"><b>关卡地图</b><span>M 打开 / 关闭</span></div>
    <div class="item"><b>暂停</b><span>P / Esc</span></div>
    <div class="item"><b>设置</b><span>S · 音量 / 全屏 / 键位</span></div>
    <div class="item"><b>全屏</b><span>F11</span></div>
    <div class="item"><b>存档</b><span>每进入一间房自动保存，标题页按 Enter 继续</span></div>
    <div class="item"><b>目标</b><span>清场后走传送门，三幕击败三位首领</span></div>
  </div>
</div>

<script>
  // 浏览器里加时间戳避免缓存；桌面版（file://）直接加载，防止查询串被当成文件名
  var __v = location.protocol === 'file:' ? '' : '?t=' + Date.now();
  document.write('<script src="data.js' + __v + '"><\/script>');
  document.write('<script src="lang.js' + __v + '"><\/script>');
  document.write('<script src="handart.js' + __v + '"><\/script>');
</script>
<script>
(function () {
  'use strict';

  /* =========================================================
     1. 画布与基础工具
     ========================================================= */
  // 逻辑分辨率 480×270，实际画布按 RS 倍渲染：文字用物理像素绘制才清晰
  const W = 480, H = 270;
  const RS = 2;
  const PW = W * RS, PH = H * RS;

  const cvs = document.getElementById('game');
  cvs.width = PW;
  cvs.height = PH;
  const ctx = cvs.getContext('2d', { alpha: false });
  ctx.imageSmoothingEnabled = false;

  // 关卡与敌人数值全部来自 data.js
  const DATA = window.ODYSSEY_DATA;
  const ROOM = DATA.room.bounds;
  const OBSTACLES = DATA.room.pillars;
  const TORCHES = DATA.room.torches;
  const SPAWNS = DATA.room.spawnPoints;
  const FLOORS = DATA.acts;
  const ENEMY_TYPES = DATA.enemies;
  const ITEMS = DATA.items;

  const FONT = '"Courier New", ui-monospace, monospace';

  const clamp = (v, a, b) => (v < a ? a : (v > b ? b : v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[(Math.random() * arr.length) | 0];
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  // 确定性哈希：地板砖纹理每次都一样，避免闪烁
  function hash(x, y) {
    let h = x * 374761393 + y * 668265263;
    h = (h ^ (h >> 13)) * 1274126177;
    return ((h ^ (h >> 16)) >>> 0) / 4294967296;
  }

  // 像素矩形（局部坐标绘制）
  function px(x, y, w, h, c) {
    ctx.fillStyle = c;
    ctx.fillRect(x, y, w, h);
  }

  // 所有界面文字统一走系统字体：按原字号映射到 1–5 档
  function text(str, x, y, size, color, align) {
    const s = size <= 9 ? 1 : size <= 17 ? 2 : size <= 21 ? 3 : size <= 29 ? 4 : 5;
    return pixelText(str, x, y, s, color, align);
  }

  // 文字统一走系统字体渲染（支持中 / 英 / 日），字号映射见 FONT_SIZES

  /* =========================================================
     1.5 多语言（中 / 英 / 日）
     ========================================================= */
  const LANG_DATA = window.ODYSSEY_LANG;
  const LANGS = LANG_DATA.languages;

  const I18N = {
    lang: 'en',
    index: 0,
  };

  // 按英文原文查表；查不到时返回原文（英文只登记模板类条目）
  function tr(str) {
    const d = LANG_DATA.dict[I18N.lang];
    if (!d) return str;
    const v = d[str];
    return v === undefined ? str : v;
  }

  // 带占位符的模板，如 T('tpl.foes', { n: 3 })
  function T(key, vars) {
    let s = tr(key);
    if (vars) {
      for (const k in vars) s = s.split('{' + k + '}').join(String(vars[k]));
    }
    return s;
  }

  function currentLang() {
    return LANGS[I18N.index] || LANGS[0];
  }

  function setLang(code) {
    for (let i = 0; i < LANGS.length; i++) {
      if (LANGS[i].code === code) {
        I18N.index = i;
        I18N.lang = code;
        settings.lang = code;
        return;
      }
    }
  }

  function cycleLang(dir) {
    const n = LANGS.length;
    let i = (I18N.index + dir + n) % n;
    setLang(LANGS[i].code);
    saveSettings();
  }

  // 点阵 scale 映射到系统字体字号（保持原有版式密度）
  const FONT_SIZES = [0, 9, 14, 20, 26, 34];

  // 统一文字绘制：关闭世界变换，用物理像素绘制，保证中文与日文清晰
  function pixelText(str, x, y, scale, color, align) {
    const s = tr(String(str));
    const size = (FONT_SIZES[scale] || 12) * RS;
    const lf = currentLang();

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.font = size + 'px ' + lf.font;
    ctx.textAlign = align === 'center' ? 'center' : (align === 'right' ? 'right' : 'left');
    ctx.textBaseline = 'top';
    ctx.fillStyle = color;
    ctx.fillText(s, Math.round(x * RS), Math.round(y * RS));

    const w = ctx.measureText(s).width / RS;
    ctx.restore();

    return w;
  }

  /* =========================================================
     2. 调色板 & 场景配置
     ========================================================= */
  const C = {
    floorA: '#2b3447',
    floorB: '#252d3d',
    floorC: '#333d52',
    grout: '#182030',
    rubble: '#3a4760',
    wall: '#3d4861',
    wallLight: '#566582',
    wallDark: '#262e3f',
    skin: '#e9bb8f',
    hood: '#8a3b34',
    hoodDark: '#5f2a26',
    armor: '#b0793a',
    armorLight: '#e5bc6d',
    pants: '#4a3a30',
    bone: '#ded9c6',
    boneDark: '#a7a28f',
    blood: '#e8483c',
  };

  // 石柱、火把、刷怪点、关卡与敌人属性均在 data.js 中配置

  /* =========================================================
     3. 设置与存档（localStorage 持久化）
     ========================================================= */
  const SETTINGS_KEY = 'odyssey.settings.v1';
  const SAVE_KEY = 'odyssey.save.v1';

  const DEFAULT_BINDS = {
    bow:   ['KeyJ', 'Space'],
    sword: ['KeyL'],
    block: ['KeyK'],
  };

  const settings = {
    bgm: 0.55,
    sfx: 0.8,
    lang: 'en',
    binds: {
      bow: DEFAULT_BINDS.bow.slice(),
      sword: DEFAULT_BINDS.sword.slice(),
      block: DEFAULT_BINDS.block.slice(),
    },
  };

  const BIND_LABEL = {
    bow: 'BOW', sword: 'SWORD', block: 'BLOCK',
  };

  // 键码 → 可读名字，设置页显示用
  function keyName(code) {
    if (!code) return '-';
    if (code === 'Space') return 'SPACE';
    if (code === 'ShiftLeft') return 'L-SHIFT';
    if (code === 'ShiftRight') return 'R-SHIFT';
    if (code.indexOf('Key') === 0) return code.slice(3);
    if (code.indexOf('Digit') === 0) return code.slice(5);
    if (code.indexOf('Arrow') === 0) return code.slice(5).toUpperCase();
    return code.toUpperCase();
  }

  function loadSettings() {
    try {
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (!raw) return;
      const s = JSON.parse(raw);
      if (typeof s.bgm === 'number') settings.bgm = clamp(s.bgm, 0, 1);
      if (typeof s.sfx === 'number') settings.sfx = clamp(s.sfx, 0, 1);
      if (typeof s.lang === 'string') setLang(s.lang);
      if (s.binds) {
        ['bow', 'sword', 'block'].forEach(function (k) {
          if (Array.isArray(s.binds[k]) && s.binds[k].length) settings.binds[k] = s.binds[k];
        });
      }
    } catch (e) { /* 存档损坏时忽略，用默认值 */ }
  }

  function saveSettings() {
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({
        bgm: settings.bgm,
        sfx: settings.sfx,
        lang: settings.lang,
        binds: settings.binds,
      }));
    } catch (e) { /* 隐私模式下写入失败不影响游戏 */ }
  }

  // 某个动作当前绑定的主键
  function bindKey(action) {
    return settings.binds[action][0];
  }

  function isDown(action) {
    const list = settings.binds[action];
    for (let i = 0; i < list.length; i++) if (keys.has(list[i])) return true;
    return false;
  }

  function actionOf(code) {
    const names = ['bow', 'sword', 'block'];
    for (let i = 0; i < names.length; i++) {
      if (settings.binds[names[i]].indexOf(code) >= 0) return names[i];
    }
    return null;
  }

  // 把某个键从其它动作上摘掉，避免一个键绑两个动作
  function rebind(action, code) {
    const names = ['bow', 'sword', 'block'];
    for (let i = 0; i < names.length; i++) {
      if (names[i] === action) continue;
      const list = settings.binds[names[i]];
      const idx = list.indexOf(code);
      if (idx >= 0) list.splice(idx, 1);
      if (!list.length) list.push(DEFAULT_BINDS[names[i]][0]);
    }
    settings.binds[action] = [code];
    saveSettings();
  }

  function resetBinds() {
    ['bow', 'sword', 'block'].forEach(function (k) {
      settings.binds[k] = DEFAULT_BINDS[k].slice();
    });
    saveSettings();
  }

  let saveCache;   // undefined 表示还没读过

  function loadSave() {
    if (saveCache !== undefined) return saveCache;
    saveCache = null;
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (typeof s.level !== 'number' || typeof s.roomIndex !== 'number') return null;
      if (s.level < 0 || s.level >= FLOORS.length) return null;
      saveCache = s;
    } catch (e) { saveCache = null; }
    return saveCache;
  }

  function writeSave() {
    saveCache = {
      level: game.level,
      roomIndex: game.roomIndex,
      hp: player.hp,
      coins: game.coins,
      items: player.items.slice(),
    };
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(saveCache));
    } catch (e) { /* 忽略 */ }
  }

  function clearSave() {
    saveCache = null;
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* 忽略 */ }
  }

  function toggleFullscreen() {
    try {
      if (!document.fullscreenElement) {
        const el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen();
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    } catch (e) { /* 部分环境不允许全屏，静默失败 */ }
  }

  loadSettings();

  /* =========================================================
     4. 音效（WebAudio 实时合成，无音频素材）
     ========================================================= */
  const Sfx = (function () {
    let ac = null;
    function ready() {
      if (ac) return ac;
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
      if (ac && ac.state === 'suspended') ac.resume();
      return ac;
    }
    function tone(freq, dur, type, vol, slideTo) {
      if (!ready()) return;
      const v = vol * settings.sfx;
      if (v < 0.0005) return;
      const t0 = ac.currentTime;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(v, t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t0); o.stop(t0 + dur + 0.03);
    }
    // 噪声：海浪
    function noise(dur, vol, cutoff) {
      if (!ready()) return;
      const v = vol * settings.sfx;
      if (v < 0.0005) return;
      const len = Math.floor(ac.sampleRate * dur);
      const buf = ac.createBuffer(1, len, ac.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) {
        const env = Math.min(1, i / (len * 0.25)) * (1 - i / len);
        data[i] = (Math.random() * 2 - 1) * env;
      }
      const src = ac.createBufferSource();
      src.buffer = buf;
      const f = ac.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = cutoff;
      const g = ac.createGain();
      g.gain.value = v;
      src.connect(f); f.connect(g); g.connect(ac.destination);
      src.start();
    }
    return {
      ready: ready,
      ctx: ready,
      swing: function () { noise(0.13, 0.05, 1600); tone(640, 0.10, 'square', 0.04, 240); },
      hit:   function () { tone(150, 0.10, 'square', 0.085, 70); tone(330, 0.05, 'triangle', 0.05, 120); },
      crit:  function () { tone(880, 0.08, 'square', 0.06, 420); tone(160, 0.12, 'square', 0.08, 60); },
      hurt:  function () { tone(180, 0.28, 'sawtooth', 0.10, 60); },
      block: function () { tone(1150, 0.09, 'square', 0.05, 520); },
      kill:  function () { tone(280, 0.20, 'triangle', 0.09, 80); },
      door:  function () { tone(520, 0.16, 'sine', 0.08, 780); setTimeout(function(){ tone(780, 0.20, 'sine', 0.05, 1040); }, 110); },
      bow:   function () { tone(190, 0.55, 'triangle', 0.09, 92); tone(680, 0.14, 'square', 0.035, 300); },
      draw:  function () { tone(240, 0.12, 'triangle', 0.05, 130); },
      arrow: function () { noise(0.10, 0.05, 2600); tone(760, 0.09, 'triangle', 0.05, 240); },
      crate: function () { noise(0.16, 0.065, 900); tone(180, 0.10, 'square', 0.05, 90); },
      coin:  function () { tone(1046, 0.06, 'square', 0.045, 1568); setTimeout(function(){ tone(1568, 0.09, 'square', 0.035, 2093); }, 60); },
      heal:  function () { tone(523, 0.10, 'sine', 0.055, 784); setTimeout(function(){ tone(784, 0.14, 'sine', 0.045, 1046); }, 90); },
      reward: function () { tone(523, 0.16, 'triangle', 0.06, 784); setTimeout(function(){ tone(784, 0.20, 'sine', 0.05, 1046); }, 120); },
      boss:  function () { tone(88, 0.7, 'sawtooth', 0.1, 58); tone(176, 0.3, 'square', 0.05, 90); },
      wave:  function () { noise(2.2, 0.055, 620); },
      defeat: function () { tone(70, 1.2, 'sawtooth', 0.1, 45); setTimeout(function(){ tone(110, 0.9, 'triangle', 0.07, 70); }, 320); },
      level: function () { tone(440, 0.12, 'square', 0.06, 660); setTimeout(function(){ tone(660, 0.16, 'square', 0.06, 880); }, 120); },
      die:   function () { tone(220, 0.7, 'sawtooth', 0.12, 55); },
    };
  })();

  /* =========================================================
     5. BGM（程序化：低频持续音 + 随机拨弦，按幕换调）
     ========================================================= */
  const Bgm = (function () {
    // 三幕根音逐幕下沉：D3 / C3 / A2
    const ROOTS = [146.83, 130.81, 110.00];
    const SCALE = [0, 3, 5, 7, 10, 12];
    let master = null;
    let drones = [];
    let timer = null;
    let act = 0;
    let running = false;
    let ducked = false;

    function ensure() {
      const ac = Sfx.ctx();
      if (!ac) return null;
      if (!master) {
        master = ac.createGain();
        master.gain.value = 0.0001;
        master.connect(ac.destination);
      }
      return ac;
    }

    function targetGain() {
      if (!running) return 0.0001;
      return Math.max(0.0001, settings.bgm * (ducked ? 0.28 : 1));
    }

    function applyVolume(smooth) {
      const ac = ensure();
      if (!ac || !master) return;
      const t = ac.currentTime;
      const v = targetGain();
      master.gain.cancelScheduledValues(t);
      if (smooth) master.gain.setTargetAtTime(v, t, 0.25);
      else master.gain.setValueAtTime(v, t);
    }

    function note(freq, dur, vol, type) {
      const ac = ensure();
      if (!ac || !running) return;
      const t0 = ac.currentTime;
      const o = ac.createOscillator();
      const g = ac.createGain();
      const f = ac.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 1400;
      o.type = type || 'triangle';
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(f); f.connect(g); g.connect(master);
      o.start(t0); o.stop(t0 + dur + 0.05);
    }

    function pluck() {
      if (!running) return;
      const root = ROOTS[act % ROOTS.length];
      const semi = SCALE[(Math.random() * SCALE.length) | 0];
      const freq = root * Math.pow(2, semi / 12) * 2;
      note(freq, rand(1.1, 2.0), 0.05, 'triangle');
      if (Math.random() < 0.32) note(freq / 2, 2.4, 0.028, 'sine');
    }

    function schedule() {
      clearTimeout(timer);
      timer = setTimeout(function () {
        pluck();
        schedule();
      }, rand(2100, 4000));
    }

    function stopDrones() {
      for (let i = 0; i < drones.length; i++) {
        try { drones[i].o.stop(); } catch (e) { /* 已停止 */ }
      }
      drones = [];
    }

    // 持续低音：根音 + 五度 + 微失谐的八度，营造海上漂泊的空旷感
    function makeDrones() {
      const ac = ensure();
      if (!ac) return;
      stopDrones();
      const root = ROOTS[act % ROOTS.length];
      const mix = [[1, 0.07, 480], [1.5, 0.032, 420], [2.0, 0.016, 360]];
      for (let i = 0; i < mix.length; i++) {
        const o = ac.createOscillator();
        const g = ac.createGain();
        const f = ac.createBiquadFilter();
        f.type = 'lowpass';
        f.frequency.value = mix[i][2];
        o.type = 'sine';
        o.frequency.value = root * mix[i][0] * (i === 2 ? 1.004 : 1);
        g.gain.value = mix[i][1];
        o.connect(f); f.connect(g); g.connect(master);
        o.start();
        drones.push({ o: o, g: g });
      }
    }

    return {
      start: function () {
        const ac = ensure();
        if (!ac) return;
        running = true;
        applyVolume(false);
        applyVolume(true);
        makeDrones();
        schedule();
      },
      stop: function () {
        running = false;
        clearTimeout(timer);
        stopDrones();
        applyVolume(true);
      },
      // 换幕时只重建持续音，拨弦自然跟随
      setAct: function (idx) {
        if (act === idx) return;
        act = idx;
        if (running) makeDrones();
      },
      setVolume: function () { applyVolume(true); },
      duck: function (on) {
        if (ducked === on) return;
        ducked = on;
        applyVolume(true);
      },
    };
  })();

  /* =========================================================
     6. 玩家 & 游戏状态
     ========================================================= */
  // 基础值：道具只在其上叠加，不直接改这些常量
  const BASE = {
    speed: 104,
    arrowDmg: 2,
    arrowSpeed: 330,
    bowWindup: 0.16,
    bowCd: 0.38,
    meleeDmg: 2,
    maxHp: 3,
    blockDrain: 22,      // 格挡每秒体力消耗
    coinBonus: 0,
    lifesteal: 0,
  };

  const ATK_DUR = 0.32;   // 一次挥砍动画时长（起手 + 劈砍 + 收招）
  const ATK_CD = 0.24;    // 挥砍后冷却
  const ATK_HIT = 0.11;   // 触发命中的时间点（劈砍中段）
  const ATK_WINDUP = 0.16;  // 起手阶段占比：快速抬剑，之后进入劈砍
  const ATK_SLASH = 0.68;   // 劈砍结束占比，之后是收招回带

  const ARROW_LIFE = 1.2;   // 箭矢最长存活时间

  // 一击必杀调试开关：正式版保持 false
  const ONE_HIT_KILL = false;

  // 角色绘制放大倍数，让角色接近以撒那种体量
  const SPRITE_SCALE = 2;

  const player = {
    x: 240, y: 196, w: 12, h: 16,
    face: 'up',
    hp: 3, maxHp: 3,
    stamina: 100, maxStamina: 100,
    state: 'idle',           // idle | walk | attack | hurt | dead
    animT: 0,
    attackT: 0,
    attackCd: 0,
    attackHitDone: false,
    invuln: 0,
    hurtT: 0,
    kbx: 0, kby: 0,
    staminaDelay: 0,
    blocking: false,
    slowT: 0,
    bowT: -1,                // >=0 表示拉弓中（秒）
    bowCd: 0,
    bowFace: 'up',

    // 道具带来的最终属性，由 recalcStats() 从 BASE + mods 重算
    speed: BASE.speed,
    arrowDmg: BASE.arrowDmg,
    arrowSpeed: BASE.arrowSpeed,
    bowWindup: BASE.bowWindup,
    bowCdMax: BASE.bowCd,
    meleeDmg: BASE.meleeDmg,
    blockDrain: BASE.blockDrain,
    coinBonus: BASE.coinBonus,
    lifesteal: BASE.lifesteal,
    mods: {},                // 各道具 mods 的累加
    items: [],               // 已获得的道具 key，按获得顺序
  };

  // 重新计算受道具影响的属性
  function recalcStats() {
    const m = player.mods;
    player.speed = BASE.speed * (1 + (m.speedPct || 0));
    player.arrowDmg = BASE.arrowDmg + (m.arrowDmg || 0);
    player.arrowSpeed = BASE.arrowSpeed * (1 + (m.arrowSpeedPct || 0));
    player.bowWindup = BASE.bowWindup;
    player.bowCdMax = BASE.bowCd * (1 + (m.bowCdPct || 0));
    player.meleeDmg = BASE.meleeDmg + (m.meleeDmg || 0);
    player.blockDrain = BASE.blockDrain * (1 + (m.blockCostPct || 0));
    player.coinBonus = m.coinBonus || 0;
    player.lifesteal = m.lifesteal || 0;

    // 生命上限变化时，多出来的那格直接补满
    const newMax = BASE.maxHp + (m.maxHp || 0);
    if (newMax > player.maxHp) player.hp += newMax - player.maxHp;
    player.maxHp = newMax;
    player.hp = Math.min(player.hp, player.maxHp);
  }

  // 拾取道具：记录、累加修饰、重算属性
  function applyItem(key) {
    const it = ITEMS[key];
    if (!it || player.items.indexOf(key) >= 0) return false;
    player.items.push(key);
    const mods = it.mods || {};
    for (const k in mods) player.mods[k] = (player.mods[k] || 0) + mods[k];
    recalcStats();
    return true;
  }

  function clearItems() {
    player.items = [];
    player.mods = {};
    player.maxHp = BASE.maxHp;
    player.hp = BASE.maxHp;
    recalcStats();
  }

  // 从未获得过的道具里随机抽一个，抽完则返回 null
  function rollItem() {
    const pool = [];
    for (const k in ITEMS) {
      if (player.items.indexOf(k) < 0) pool.push(k);
    }
    if (!pool.length) return null;
    return pool[(Math.random() * pool.length) | 0];
  }

  const game = {
    mode: 'title',           // title | play | paused | map | settings | dead | win | sail | defeat
    level: 0,
    theme: 'cave',           // 当前房间场景：shore | cliff | cave
    roomIndex: 0,
    rooms: FLOORS[0].rooms,
    mapNodes: FLOORS[0].map,
    time: 0,
    shake: 0,
    hitstop: 0,              // 命中顿帧计时
    hurtFlash: 0,
    fade: 0,
    banner: null,            // { text, t, max }
    hintT: 6,
    particles: [],
    floats: [],
    arrows: [],
    barrels: [],             // 当前房间的可破坏木桶
    pickups: [],             // 木桶掉落的金币 / 红心
    coins: 0,
    enemies: [],
    pending: [],
    spawnTimer: 0,
    doorOpen: false,
    entryDir: null,          // 从哪个方向进入当前房间
    exitDir: 'north',        // 通往下一个节点的门
    intro: null,             // 首领房开场演出
    introBanner: null,       // 演出结束后要显示的横幅
    transition: null,        // 幕间海上过场
    defeat: null,            // 战败过场（伊斯马罗斯）
    reward: null,            // 首领掉落、尚未拾取的道具 { key, x, y, t }
    rewardRolled: false,     // 本房间是否已经抽过道具
    rewardHold: 0,           // 拾取后的缓冲时间，避免立刻被过场打断
    itemBanner: null,        // 拾取演出 { key, t, max }
  };

  /* =========================================================
     6. 输入
     ========================================================= */
  const keys = new Set();
  let attackQueued = false;
  let bowQueued = false;

  // 标题页菜单
  const TITLE_LABEL = {
    start: 'START',
    continue: 'CONTINUE',
    new: 'NEW GAME',
    settings: 'SETTINGS',
  };
  let titleIdx = 0;

  // 有存档时多一项「继续」
  function titleItems() {
    return loadSave() ? ['continue', 'new', 'settings'] : ['start', 'settings'];
  }

  function titleKey(code) {
    const items = titleItems();
    if (code === 'KeyW' || code === 'ArrowUp') {
      titleIdx = (titleIdx + items.length - 1) % items.length;
      Sfx.draw();
    } else if (code === 'KeyS' || code === 'ArrowDown') {
      titleIdx = (titleIdx + 1) % items.length;
      Sfx.draw();
    } else if (code === 'Enter' || code === 'Space') {
      const id = items[titleIdx % items.length];
      Sfx.door();
      if (id === 'continue') {
        const s = loadSave();
        if (s) resumeGame(s);
      } else if (id === 'start' || id === 'new') {
        startNewGame();
      } else if (id === 'settings') {
        openSettings();
      }
    }
  }

  // 设置页
  const SETTINGS_ROWS = ['bgm', 'sfx', 'lang', 'bow', 'sword', 'block', 'fullscreen', 'reset', 'back'];
  let setIdx = 0;
  let rebindAction = null;
  let settingsReturn = 'title';

  function openSettings() {
    if (game.mode !== 'title' && game.mode !== 'paused') return;
    settingsReturn = game.mode;
    game.mode = 'settings';
    setIdx = 0;
    rebindAction = null;
    Bgm.duck(true);
  }

  function closeSettings() {
    game.mode = settingsReturn;
    rebindAction = null;
    saveSettings();
    Bgm.duck(game.mode === 'paused');
  }

  function adjustSetting(row, dir) {
    if (row === 'bgm') {
      settings.bgm = clamp(Math.round((settings.bgm + dir * 0.05) * 100) / 100, 0, 1);
      Bgm.setVolume();
    } else if (row === 'sfx') {
      settings.sfx = clamp(Math.round((settings.sfx + dir * 0.05) * 100) / 100, 0, 1);
      Sfx.swing();
    } else if (row === 'lang') {
      cycleLang(dir);
      Sfx.draw();
    }
  }

  function settingsKey(code) {
    // 重绑捕获：按下任意键即绑定，Esc 取消
    if (rebindAction) {
      if (code === 'Escape') { rebindAction = null; Sfx.draw(); return; }
      if (code === 'Enter') return;
      rebind(rebindAction, code);
      rebindAction = null;
      Sfx.door();
      return;
    }

    const row = SETTINGS_ROWS[setIdx];
    if (code === 'KeyW' || code === 'ArrowUp') {
      setIdx = (setIdx + SETTINGS_ROWS.length - 1) % SETTINGS_ROWS.length;
      Sfx.draw();
    } else if (code === 'KeyS' || code === 'ArrowDown') {
      setIdx = (setIdx + 1) % SETTINGS_ROWS.length;
      Sfx.draw();
    } else if (code === 'KeyA' || code === 'ArrowLeft') {
      adjustSetting(row, -1);
    } else if (code === 'KeyD' || code === 'ArrowRight') {
      adjustSetting(row, 1);
    } else if (code === 'Enter' || code === 'Space') {
      Sfx.door();
      if (row === 'bow' || row === 'sword' || row === 'block') {
        rebindAction = row;
      } else if (row === 'fullscreen') {
        toggleFullscreen();
      } else if (row === 'reset') {
        resetBinds();
        settings.bgm = 0.55;
        settings.sfx = 0.8;
        saveSettings();
        Bgm.setVolume();
      } else if (row === 'back') {
        closeSettings();
      }
    } else if (code === 'Escape' || code === 'KeyP') {
      closeSettings();
    }
  }

  window.addEventListener('keydown', function (e) {
    const code = e.code;
    if (code === 'Space' || code.indexOf('Arrow') === 0 || code === 'F11') e.preventDefault();
    Sfx.ready();

    if (game.mode === 'settings') {
      if (!e.repeat) settingsKey(code);
      return;
    }

    // 标题页：上下选择菜单项，Enter 确认
    if (game.mode === 'title') {
      if (!e.repeat) titleKey(code);
      keys.add(code);
      return;
    }

    if (!e.repeat) {
      const act = actionOf(code);
      if (act === 'bow') bowQueued = true;
      if (act === 'sword') attackQueued = true;
      if (code === 'KeyS' && game.mode === 'paused') openSettings();
      if (code === 'KeyR') onRestart();
      if (code === 'KeyM') toggleMap();
      if (code === 'KeyP' || code === 'Escape') togglePause();
      if (code === 'F11') toggleFullscreen();
    }
    keys.add(code);
  });

  window.addEventListener('keyup', function (e) { keys.delete(e.code); });
  window.addEventListener('blur', function () { keys.clear(); });

  // 从标题页开新局：丢弃旧存档
  function startNewGame() {
    if (game.mode !== 'title') return;
    Sfx.ready();
    clearSave();
    resetGame();
  }

  function onRestart() {
    if (game.mode === 'dead' || game.mode === 'win') {
      clearSave();
      resetGame();
    }
  }

  function togglePause() {
    if (game.mode === 'play') {
      game.mode = 'paused';
      Bgm.duck(true);
    } else if (game.mode === 'paused') {
      game.mode = 'play';
      Bgm.duck(false);
    } else if (game.mode === 'map') {
      game.mode = 'play';
      Bgm.duck(false);
    }
  }

  function toggleMap() {
    if (game.mode === 'play') {
      game.mode = 'map';
      Bgm.duck(true);
    } else if (game.mode === 'map') {
      game.mode = 'play';
      Bgm.duck(false);
    }
  }

  /* =========================================================
     7. 关卡流程
     ========================================================= */
  function resetGame() {
    clearItems();
    player.hp = player.maxHp;
    player.stamina = player.maxStamina;
    player.state = 'idle';
    player.invuln = 0;
    player.kbx = 0; player.kby = 0;
    player.slowT = 0;
    game.mode = 'play';
    game.hintT = 6;
    game.coins = 0;
    game.transition = null;
    game.level = 0;
    Bgm.setAct(0);
    Bgm.start();
    startFloor(0);
  }

  // 从存档继续：直接回到存档所在的幕与房间
  function resumeGame(s) {
    clearItems();
    // 恢复已获得的道具，再按存档补生命
    if (Array.isArray(s.items)) {
      for (let i = 0; i < s.items.length; i++) applyItem(s.items[i]);
    }

    player.stamina = player.maxStamina;
    player.state = 'idle';
    player.invuln = 0;
    player.kbx = 0; player.kby = 0;
    player.slowT = 0;
    game.mode = 'play';
    game.hintT = 6;
    game.transition = null;

    const lv = clamp(s.level, 0, FLOORS.length - 1);
    game.level = lv;
    game.rooms = FLOORS[lv].rooms;
    game.mapNodes = FLOORS[lv].map;
    game.coins = Math.max(0, s.coins | 0);
    player.hp = clamp(s.hp, 1, player.maxHp);

    Bgm.setAct(lv);
    Bgm.start();

    const idx = clamp(s.roomIndex, 0, game.rooms.length - 1);
    enterRoom(idx);
    game.banner = {
      text: T('tpl.actBanner', { n: ['I', 'II', 'III'][lv] }),
      sub: FLOORS[lv].name,
      t: 2.4, max: 2.4,
    };
    Sfx.level();
  }

  // 进入某一层：重置房间进度，从起点房开始
  function startFloor(idx) {
    game.level = idx;
    game.rooms = FLOORS[idx].rooms;
    game.mapNodes = FLOORS[idx].map;
    // 下楼时补充生命（3 格上限下 +1 约等于原来的 +3/8）
    if (idx > 0) player.hp = Math.min(player.maxHp, player.hp + 1);

    Bgm.setAct(idx);
    enterRoom(0);
    game.banner = {
      text: T('tpl.actBanner', { n: ['I', 'II', 'III'][idx] }),
      sub: FLOORS[idx].name,
      t: 2.8, max: 2.8,
    };
    Sfx.level();
  }

  // 地图节点间方向 → 房间墙上对应的门
  function dirBetween(a, b) {
    const dx = b[0] - a[0], dy = b[1] - a[1];
    if (dx > 0) return 'east';
    if (dx < 0) return 'west';
    if (dy > 0) return 'south';
    return 'north';
  }

  const OPPOSITE = { north: 'south', south: 'north', west: 'east', east: 'west' };

  function spawnPointFor(dir) {
    if (dir === 'north') return { x: 240, y: 54 };
    if (dir === 'south') return { x: 240, y: 206 };
    if (dir === 'west') return { x: 58, y: 135 };
    if (dir === 'east') return { x: 422, y: 135 };
    return { x: 240, y: 196 };
  }

  // 进入当前层的第 i 个房间
  function enterRoom(i) {
    const room = game.rooms[i];
    game.roomIndex = i;
    game.theme = room.theme || FLOORS[game.level].theme || 'cave';

    // 入口/出口朝向由地图节点的相对位置决定，和地图完全对应
    const nodes = game.mapNodes;
    game.entryDir = i > 0 ? dirBetween(nodes[i], nodes[i - 1]) : null;
    if (i < nodes.length - 1) {
      game.exitDir = dirBetween(nodes[i], nodes[i + 1]);
    } else {
      game.exitDir = game.entryDir ? OPPOSITE[game.entryDir] : 'north';
    }

    game.enemies = [];
    game.particles = [];
    game.floats = [];
    game.arrows = [];
    game.pickups = [];
    game.barrels = makeBarrels(room);
    game.banner = null;
    game.intro = null;
    game.introBanner = null;
    game.transition = null;
    game.reward = null;
    game.rewardRolled = false;
    game.rewardHold = 0;
    game.itemBanner = null;
    game.pending = room.spawns.slice();
    game.spawnTimer = 0.5;
    game.doorOpen = room.spawns.length === 0;
    game.fade = 1;

    const sp = spawnPointFor(game.entryDir);
    player.x = sp.x;
    player.y = sp.y;
    player.face = 'up';
    player.state = 'idle';
    player.attackCd = 0;
    player.bowT = -1;
    player.bowCd = 0;
    player.blocking = false;
    player.kbx = 0; player.kby = 0;
    player.invuln = Math.max(player.invuln, 0.7);

    const isFinalRoom = (game.level === FLOORS.length - 1) && (i === game.rooms.length - 1);

    if (room.type === 'boss') {
      if (isFinalRoom) {
        // 最终首领：先播弓与箭，结束后显示首领名
        game.intro = { t: 0, max: 3.4 };
        game.introBanner = { text: room.title || 'BOSS', t: 2.2, max: 2.2 };
        attackQueued = false;
        Sfx.bow();
      } else {
        game.banner = { text: room.title || 'BOSS', t: 2.2, max: 2.2 };
        Sfx.boss();
      }
    } else if (room.type !== 'start') {
      game.banner = { text: roomTitle(room), t: 1.8, max: 1.8 };
    }

    // 每次进入房间存一次档，退出后可从这一间继续
    writeSave();
  }

  function roomTitle(room) {
    if (room.type === 'elite') return 'TRIAL';
    if (room.type === 'boss') return room.title || 'BOSS';
    return 'AMBUSH';
  }

  // 木桶：每间房随机摆放几只可破坏的酒桶，避开门口、刷怪点与场景装饰
  function makeBarrels(room) {
    const count = room.type === 'boss' ? 2
      : room.type === 'start' ? 1
      : 2 + (Math.random() < 0.5 ? 1 : 0);

    // 点位禁区：门口、房间中央通道、火盆、城池燃烧的残骸
    const keepPt = [
      spawnPointFor(game.entryDir),
      spawnPointFor(game.exitDir),
      { x: 240, y: 135 },
    ];
    for (let i = 0; i < TORCHES.length; i++) keepPt.push({ x: TORCHES[i].x + 4, y: TORCHES[i].y + 4 });
    if (game.theme === 'city') {
      keepPt.push({ x: 148, y: 58 }, { x: 332, y: 212 });
    }
    // 矩形禁区：右上角常驻小地图面板遮挡的区域
    const keepBox = [{ x: 376, y: 10, w: 96, h: 46 }];

    const list = [];

    for (let n = 0; n < count; n++) {
      for (let tries = 0; tries < 64; tries++) {
        // 软禁区随尝试次数逐步放宽，保证总能放下，同时尽量不压在装饰上
        const relax = Math.min(1, tries / 44);
        const kx = 70 - 26 * relax;
        const ky = 58 - 22 * relax;

        const x = rand(ROOM.l + 46, ROOM.r - 46);
        const y = rand(ROOM.t + 46, ROOM.b - 12);
        let ok = true;

        for (let i = 0; i < keepPt.length; i++) {
          if (Math.abs(keepPt[i].x - x) < kx && Math.abs(keepPt[i].y - y) < ky) { ok = false; break; }
        }
        if (ok) {
          for (let i = 0; i < keepBox.length; i++) {
            const k = keepBox[i];
            if (x + 10 > k.x && x - 10 < k.x + k.w && y + 2 > k.y && y - 22 < k.y + k.h) { ok = false; break; }
          }
        }
        if (ok) {
          for (let i = 0; i < OBSTACLES.length; i++) {
            const o = OBSTACLES[i];
            if (x + 10 > o.x - 6 && x - 10 < o.x + o.w + 6 &&
                y + 2 > o.y - 6 && y - 20 < o.y + o.h + 6) { ok = false; break; }
          }
        }
        if (ok) {
          for (let i = 0; i < SPAWNS.length; i++) {
            if (Math.hypot(SPAWNS[i].x - x, SPAWNS[i].y - y) < 40) { ok = false; break; }
          }
        }
        if (ok) {
          for (let i = 0; i < list.length; i++) {
            if (Math.hypot(list[i].x - x, list[i].y - y) < 40) { ok = false; break; }
          }
        }

        if (ok) {
          list.push({ x: x, y: y, broken: false, box: { x: x - 8, y: y - 19, w: 16, h: 19 } });
          break;
        }
      }
    }
    return list;
  }

  // 木桶被打碎：大概率掉金币，小概率掉红心，其余是空桶
  function breakBarrel(b) {
    if (b.broken) return;
    b.broken = true;
    burst(b.x, b.y - 9, '#8a6132', 10, 0.9);
    burst(b.x, b.y - 9, '#4a3020', 6, 0.7);
    game.shake = Math.max(game.shake, 2);
    game.hitstop = Math.max(game.hitstop, 0.03);
    Sfx.crate();

    const roll = Math.random();
    if (roll < 0.55) {
      const n = 1 + ((Math.random() * 3) | 0) + player.coinBonus;
      for (let i = 0; i < n; i++) spawnPickup('coin', b.x + rand(-5, 5), b.y - 10);
    } else if (roll < 0.75) {
      spawnPickup('heart', b.x, b.y - 10);
    }
  }

  function spawnPickup(type, x, y) {
    game.pickups.push({
      type: type,
      x: x, y: y,
      vx: rand(-46, 46), vy: rand(-30, 4),
      z: 4, vz: rand(95, 145),
      delay: 0.16, t: 0,
      life: 14,
    });
  }

  // 掉落物：从桶里弹到地上，接触即拾取，14 秒后消失
  function updatePickups(dt) {
    for (let i = game.pickups.length - 1; i >= 0; i--) {
      const p = game.pickups[i];
      p.t += dt;
      p.life -= dt;

      if (p.t >= p.delay) {
        if (p.z > 0 || p.vz > 0) {
          p.vz -= 420 * dt;
          p.z += p.vz * dt;
          if (p.z <= 0) {
            p.z = 0;
            p.vz = -p.vz * 0.32;
            if (p.vz < 40) p.vz = 0;
          }
        }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= Math.exp(-3.4 * dt);
        p.vy *= Math.exp(-3.4 * dt);
        p.x = clamp(p.x, ROOM.l + 8, ROOM.r - 8);
        p.y = clamp(p.y, ROOM.t + 10, ROOM.b - 4);

        if (Math.hypot(p.x - player.x, p.y - player.y) < 16) {
          if (p.type === 'coin') {
            game.coins++;
            addFloat(p.x, p.y - 8, '+1', '#ffd166');
            Sfx.coin();
          } else {
            player.hp = Math.min(player.maxHp, player.hp + 1);
            addFloat(p.x, p.y - 8, '+1 HP', '#ff8d7c');
            Sfx.heal();
          }
          game.pickups.splice(i, 1);
          continue;
        }
      }

      if (p.life <= 0) game.pickups.splice(i, 1);
    }
  }

  // 走入传送门：推进到下一房，最后一房则下一层或结算
  function advanceRoom() {
    if (game.roomIndex < game.rooms.length - 1) {
      enterRoom(game.roomIndex + 1);
      return;
    }
    if (game.level + 1 >= FLOORS.length) {
      game.mode = 'win';
      clearSave();
      Bgm.stop();
      Sfx.door();
    } else {
      startSail(game.level + 1);
    }
  }

  // 幕间过场：海上航行
  function startSail(next) {
    game.transition = { t: 0, max: 3.8, next: next };
    game.intro = null;
    game.mode = 'sail';
    Sfx.wave();
  }

  function spawnEnemy(type, x, y) {
    const t = ENEMY_TYPES[type];
    game.enemies.push({
      type: type,
      x: x, y: y,
      w: t.w, h: t.h, r: t.r,
      hp: t.hp, maxHp: t.hp,
      speed: t.speed, dmg: t.dmg, kbMul: t.kb,
      face: 'down',
      state: 'move', stateT: 0,
      atkCd: rand(0.5, 1.3),
      skillCd: rand(2.4, 4.6),
      chargeAng: 0,
      chargeHit: false,
      animT: rand(0, 6),
      flash: 0, hurtT: 0,
      kbx: 0, kby: 0,
      spawnT: 0.45,
      dead: false, deadT: 0, struck: false,
    });
  }

  function findSpawnPos() {
    const pool = SPAWNS.filter(function (p) { return dist(p, player) > 110; });
    return pick(pool.length ? pool : SPAWNS);
  }

  /* =========================================================
     7. 碰撞
     ========================================================= */
  function pushOutRect(e, o) {
    const hw = e.w / 2, hh = e.h / 2;
    if (e.x + hw > o.x && e.x - hw < o.x + o.w &&
        e.y + hh > o.y && e.y - hh < o.y + o.h) {
      const pl = e.x + hw - o.x;
      const pr = o.x + o.w - (e.x - hw);
      const pt = e.y + hh - o.y;
      const pb = o.y + o.h - (e.y - hh);
      const m = Math.min(pl, pr, pt, pb);
      if (m === pl) e.x -= pl;
      else if (m === pr) e.x += pr;
      else if (m === pt) e.y -= pt;
      else e.y += pb;
    }
  }

  function resolveEntity(e) {
    const hw = e.w / 2, hh = e.h / 2;
    e.x = clamp(e.x, ROOM.l + hw, ROOM.r - hw);
    e.y = clamp(e.y, ROOM.t + hh, ROOM.b - hh);

    for (let i = 0; i < OBSTACLES.length; i++) pushOutRect(e, OBSTACLES[i]);
    for (let i = 0; i < game.barrels.length; i++) {
      const b = game.barrels[i];
      if (!b.broken) pushOutRect(e, b.box);
    }
  }

  function overlap(a, b) {
    return Math.abs(a.x - b.x) < (a.w + b.w) / 2 &&
           Math.abs(a.y - b.y) < (a.h + b.h) / 2;
  }

  function faceAngle(f) {
    if (f === 'right') return 0;
    if (f === 'down') return Math.PI / 2;
    if (f === 'left') return Math.PI;
    return -Math.PI / 2;
  }

  /* =========================================================
     8. 粒子 / 飘字
     ========================================================= */
  function burst(x, y, color, n, power) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2);
      const s = rand(30, 110) * (power || 1);
      game.particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - 20,
        life: rand(0.25, 0.55), max: 0.55,
        size: Math.random() < 0.35 ? 3 : 2,
        color: color,
        grav: 260,
      });
    }
  }

  function addFloat(x, y, str, color) {
    game.floats.push({ x: x, y: y, text: str, color: color, t: 0.75, max: 0.75 });
  }

  /* =========================================================
     9. 玩家更新
     ========================================================= */
  function startAttack() {
    player.state = 'attack';
    player.attackT = 0;
    player.attackHitDone = false;
    player.atkFace = player.face;
    // 出剑时向前小步突进，让挥击有重量
    const a = faceAngle(player.face);
    player.kbx += Math.cos(a) * 62;
    player.kby += Math.sin(a) * 62;
    Sfx.swing();
  }

  function updatePlayer(dt) {
    const p = player;
    p.animT += dt;
    p.attackCd = Math.max(0, p.attackCd - dt);
    p.bowCd = Math.max(0, p.bowCd - dt);
    p.invuln = Math.max(0, p.invuln - dt);
    p.staminaDelay = Math.max(0, p.staminaDelay - dt);
    p.slowT = Math.max(0, p.slowT - dt);

    let dx = 0, dy = 0;
    if (keys.has('KeyA') || keys.has('ArrowLeft')) dx -= 1;
    if (keys.has('KeyD') || keys.has('ArrowRight')) dx += 1;
    if (keys.has('KeyW') || keys.has('ArrowUp')) dy -= 1;
    if (keys.has('KeyS') || keys.has('ArrowDown')) dy += 1;

    if (dx || dy) {
      const len = Math.hypot(dx, dy);
      dx /= len; dy /= len;
      // 攻击 / 拉弓期间锁定朝向，避免中途转向
      if (p.state !== 'attack' && p.bowT < 0) {
        if (Math.abs(dx) > Math.abs(dy)) p.face = dx < 0 ? 'left' : 'right';
        else p.face = dy < 0 ? 'up' : 'down';
      }
    }

    // 格挡：消耗体力，移速降低，体力耗尽自动破防
    const wantBlock = isDown('block') || keys.has('ShiftLeft') || keys.has('ShiftRight');
    p.blocking = wantBlock && p.stamina > 6 && p.state !== 'attack' && p.state !== 'hurt' && p.bowT < 0;

    if (p.blocking) {
      p.stamina = Math.max(0, p.stamina - p.blockDrain * dt);
      p.staminaDelay = 0.45;
    } else if (p.staminaDelay <= 0) {
      p.stamina = Math.min(p.maxStamina, p.stamina + 28 * dt);
    }

    // 攻击（输入缓冲）
    if (attackQueued) {
      attackQueued = false;
      if (p.attackCd <= 0 && p.state !== 'hurt' && p.bowT < 0) startAttack();
    }

    // 拉弓（按住可连射）：拉满自动放箭
    const wantBow = bowQueued || isDown('bow') || keys.has('Space');
    bowQueued = false;
    if (wantBow && p.bowCd <= 0 && p.bowT < 0 && p.state !== 'hurt' && p.state !== 'attack') {
      p.bowT = 0;
      p.bowFace = p.face;
      Sfx.draw();
    }
    if (p.bowT >= 0) {
      p.bowT += dt;
      if (p.bowT >= p.bowWindup) {
        shootArrow();
        p.bowT = -1;
        p.bowCd = p.bowCdMax;
      }
    }

    // 位移
    let sp = p.speed;
    if (p.blocking) sp *= 0.36;
    if (p.state === 'attack') sp *= 0.30;
    if (p.bowT >= 0) sp *= 0.5;
    if (p.state === 'hurt') sp = 0;
    if (p.slowT > 0) sp *= 0.6;

    p.x += dx * sp * dt + p.kbx * dt;
    p.y += dy * sp * dt + p.kby * dt;
    p.kbx *= Math.exp(-9 * dt);
    p.kby *= Math.exp(-9 * dt);
    resolveEntity(p);

    // 状态推进
    if (p.state === 'attack') {
      p.attackT += dt;
      if (!p.attackHitDone && p.attackT >= ATK_HIT) {
        p.attackHitDone = true;
        doPlayerHit();
      }
      if (p.attackT >= ATK_DUR) {
        p.state = 'idle';
        p.attackT = 0;
        p.attackCd = ATK_CD;
      }
    } else if (p.state === 'hurt') {
      p.hurtT -= dt;
      if (p.hurtT <= 0) p.state = 'idle';
    } else {
      p.state = (dx || dy) ? 'walk' : 'idle';
    }
  }

  // 放箭：从角色胸前朝锁定方向射出
  function shootArrow() {
    const p = player;
    const a = faceAngle(p.bowFace || p.face);
    game.arrows.push({
      x: p.x + Math.cos(a) * 12,
      y: p.y - 8 + Math.sin(a) * 12,
      vx: Math.cos(a) * player.arrowSpeed,
      vy: Math.sin(a) * player.arrowSpeed,
      ang: a,
      life: ARROW_LIFE,
    });
    Sfx.arrow();
  }

  // 箭矢推进：飞出边界、撞柱、命中敌人都会消失
  function updateArrows(dt) {
    for (let i = game.arrows.length - 1; i >= 0; i--) {
      const ar = game.arrows[i];
      ar.life -= dt;
      ar.x += ar.vx * dt;
      ar.y += ar.vy * dt;

      let gone = ar.life <= 0 ||
        ar.x < ROOM.l + 4 || ar.x > ROOM.r - 4 || ar.y < ROOM.t + 4 || ar.y > ROOM.b - 4;

      if (!gone) {
        for (let j = 0; j < OBSTACLES.length; j++) {
          const o = OBSTACLES[j];
          if (ar.x > o.x && ar.x < o.x + o.w && ar.y > o.y && ar.y < o.y + o.h) { gone = true; break; }
        }
      }

      // 箭射中木桶：桶碎并掉落
      if (!gone) {
        for (let j = 0; j < game.barrels.length; j++) {
          const b = game.barrels[j];
          if (b.broken) continue;
          if (ar.x > b.box.x && ar.x < b.box.x + b.box.w &&
              ar.y > b.box.y && ar.y < b.box.y + b.box.h) {
            breakBarrel(b);
            gone = true;
            break;
          }
        }
      }

      if (!gone) {
        for (let j = 0; j < game.enemies.length; j++) {
          const e = game.enemies[j];
          if (e.dead || e.spawnT > 0) continue;
          if (Math.hypot(e.x - ar.x, e.y - ar.y) < e.r + 4) {
            damageEnemy(e, player.arrowDmg, ar.ang);
            gone = true;
            break;
          }
        }
      }

      if (gone) {
        burst(ar.x, ar.y, '#e8d8ad', 4, 0.6);
        game.arrows.splice(i, 1);
      }
    }
  }

  // 面朝方向的扇形攻击判定
  function doPlayerHit() {
    const p = player;
    const a = faceAngle(p.atkFace || p.face);
    let hit = false;

    for (let i = 0; i < game.enemies.length; i++) {
      const e = game.enemies[i];
      if (e.dead || e.spawnT > 0) continue;
      const d = dist(p, e);
      if (d > 40 + e.r) continue;
      let diff = Math.atan2(e.y - p.y, e.x - p.x) - a;
      diff = Math.abs(Math.atan2(Math.sin(diff), Math.cos(diff)));
      if (diff > 1.0) continue;

      damageEnemy(e, p.meleeDmg, Math.atan2(e.y - p.y, e.x - p.x));
      hit = true;
    }

    // 挥剑同样能劈开木桶
    for (let i = 0; i < game.barrels.length; i++) {
      const b = game.barrels[i];
      if (b.broken) continue;
      const bx = b.x, by = b.y - 9;
      if (Math.hypot(bx - p.x, by - p.y) > 50) continue;
      let diff = Math.atan2(by - p.y, bx - p.x) - a;
      diff = Math.abs(Math.atan2(Math.sin(diff), Math.cos(diff)));
      if (diff > 1.0) continue;
      breakBarrel(b);
    }

    if (hit) game.shake = Math.max(game.shake, 2.2);
  }

  function damageEnemy(e, dmg, ang) {
    if (e.dead) return;
    const crit = ONE_HIT_KILL || Math.random() < 0.18;
    const real = ONE_HIT_KILL ? e.hp : (crit ? dmg + 1 : dmg);

    e.hp -= real;
    e.flash = 0.13;
    e.hurtT = 0.16;
    const kb = 105 * e.kbMul;
    e.kbx += Math.cos(ang) * kb;
    e.kby += Math.sin(ang) * kb;

    burst(e.x, e.y - e.h * 0.3, crit ? '#ffd166' : '#f5f2e6', crit ? 10 : 6);
    addFloat(e.x, e.y - e.h - 4, ONE_HIT_KILL ? 'KO' : String(real), crit ? '#ffd166' : '#ffffff');
    game.shake = Math.max(game.shake, crit ? 4 : 2.6);
    game.hitstop = Math.max(game.hitstop, crit ? 0.06 : 0.04);

    if (crit) Sfx.crit(); else Sfx.hit();

    if (e.hp <= 0) {
      e.hp = 0;
      e.dead = true;
      e.deadT = 0;
      burst(e.x, e.y - 4, '#e8483c', 14, 1.2);
      burst(e.x, e.y - 4, '#ffd166', 8, 0.8);
      game.shake = Math.max(game.shake, 5);
      Sfx.kill();

      // 喀耳刻的药草：击杀有概率回血
      if (player.lifesteal > 0 && player.hp < player.maxHp && Math.random() < player.lifesteal) {
        player.hp = Math.min(player.maxHp, player.hp + 1);
        addFloat(player.x, player.y - 26, '+1 HP', '#79d6a0');
        burst(player.x, player.y - 6, '#79d6a0', 6, 0.6);
      }
    }
  }

  function damagePlayer(dmg, ang, blockable) {
    const p = player;
    if (p.invuln > 0 || p.state === 'dead' || game.mode !== 'play') return;

    // 格挡：正面减伤 + 消耗体力
    if (p.blocking && blockable !== false) {
      p.stamina = Math.max(0, p.stamina - 16);
      p.staminaDelay = 0.7;
      p.invuln = 0.28;
      p.kbx += Math.cos(ang) * 45;
      p.kby += Math.sin(ang) * 45;
      burst(p.x - Math.cos(ang) * 8, p.y - Math.sin(ang) * 8 - 2, '#cfe3ff', 9, 0.7);
      addFloat(p.x, p.y - 20, 'BLOCK', '#9fd3ff');
      game.shake = Math.max(game.shake, 3);
      Sfx.block();
      return;
    }

    p.hp -= dmg;
    p.state = 'hurt';
    p.hurtT = 0.22;
    p.bowT = -1;
    p.invuln = 0.9;
    p.kbx += Math.cos(ang) * 130;
    p.kby += Math.sin(ang) * 130;
    game.shake = 6.5;
    game.hurtFlash = 0.4;
    burst(p.x, p.y - 4, '#e8483c', 10);
    addFloat(p.x, p.y - 22, '-' + dmg, '#ff7b6b');
    Sfx.hurt();

    if (p.hp <= 0) {
      p.hp = 0;
      p.state = 'dead';
      game.mode = 'dead';
      clearSave();
      Bgm.stop();
      burst(p.x, p.y - 4, '#e8483c', 26, 1.4);
      Sfx.die();
    }
  }

  /* =========================================================
     10. 敌人更新
     ========================================================= */
  function updateEnemy(e, dt) {
    e.animT += dt;
    e.flash = Math.max(0, e.flash - dt);

    if (e.dead) { e.deadT += dt; return; }
    if (e.spawnT > 0) { e.spawnT -= dt; return; }

    // 战车半血时召唤两名士兵
    if (e.type === 'chariot' && !e.summoned && e.hp <= e.maxHp / 2) {
      e.summoned = true;
      addFloat(e.x, e.y - 38, 'REINFORCEMENTS', '#ffd166');
      for (let i = 0; i < 2; i++) {
        const sp = findSpawnPos();
        spawnEnemy('soldier', sp.x, sp.y);
      }
      game.shake = Math.max(game.shake, 4);
    }

    e.atkCd = Math.max(0, e.atkCd - dt);
    e.skillCd = Math.max(0, e.skillCd - dt);
    e.stateT += dt;

    // 击退位移
    e.x += e.kbx * dt;
    e.y += e.kby * dt;
    e.kbx *= Math.exp(-9 * dt);
    e.kby *= Math.exp(-9 * dt);
    resolveEntity(e);

    if (e.hurtT > 0) { e.hurtT -= dt; return; }

    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    const nx = dx / d, ny = dy / d;

    if (e.state === 'move') {
      if (e.type === 'citizen') {
        // 平民：朝远离玩家的方向逃跑
        const away = Math.atan2(-dy, -dx);
        e.x += Math.cos(away) * e.speed * dt;
        e.y += Math.sin(away) * e.speed * dt;
        resolveEntity(e);
        e.face = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down');

        const nearEdge = e.x < ROOM.l + 36 || e.x > ROOM.r - 36 ||
                         e.y < ROOM.t + 36 || e.y > ROOM.b - 36;
        if ((nearEdge || d < 48) && e.atkCd <= 0) {
          e.state = 'throwWind'; e.stateT = 0;
        }
      } else {
        const sp = e.speed;

        e.x += nx * sp * dt;
        e.y += ny * sp * dt;
        resolveEntity(e);

        e.face = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down');

        // 贴身接触伤害（战车只靠冲锋）
        if (e.type !== 'chariot' && overlap(e, player) && e.atkCd <= 0) {
          e.atkCd = 1.05;
          damagePlayer(e.dmg, Math.atan2(dy, dx));
        }

        // 起手与技能
        if (e.type === 'skeleton' && d < 32 && e.atkCd <= 0) {
          e.state = 'windup'; e.stateT = 0; e.struck = false;
        } else if (e.type === 'soldier' && d < 46 && e.atkCd <= 0) {
          e.state = 'windup'; e.stateT = 0; e.struck = false;
        } else if (e.type === 'chariot') {
          if (e.skillCd <= 0 && d > 80 && d < 220) {
            e.state = 'charge'; e.stateT = 0; e.skillCd = 4.5;
            e.chargeAng = Math.atan2(dy, dx);
            e.chargeHit = false;
          } else if (e.atkCd <= 0 && d < 130) {
            e.state = 'windup'; e.stateT = 0; e.struck = false;
          }
        } else if (e.type === 'boss' && d < 50 && e.atkCd <= 0) {
          e.state = 'windup'; e.stateT = 0; e.struck = false;
        } else if (e.type === 'lotus') {
          if (d < 42 && e.atkCd <= 0) {
            e.state = 'windup'; e.stateT = 0; e.struck = false;
          } else if (e.skillCd <= 0 && d < 130) {
            e.state = 'cast'; e.stateT = 0; e.skillCd = 5.5;
          }
        } else if (e.type === 'cyclops') {
          if (d < 64 && e.atkCd <= 0) {
            e.state = 'windup'; e.stateT = 0; e.struck = false;
          } else if (e.skillCd <= 0 && d > 60 && d < 180) {
            e.state = 'charge'; e.stateT = 0; e.skillCd = 6.5;
            e.chargeAng = Math.atan2(dy, dx);
            e.chargeHit = false;
          }
        }
      }

    } else if (e.state === 'windup') {
      // 抬手蓄力（红色预警圈）
      let wt = 0.42;
      if (e.type === 'soldier') wt = 0.35;
      else if (e.type === 'chariot') wt = 0.55;
      else if (e.type === 'lotus') wt = 0.5;
      else if (e.type === 'cyclops') wt = 0.7;
      else if (e.type === 'boss') wt = 0.55;
      if (e.stateT > wt) { e.state = 'strike'; e.stateT = 0; }

    } else if (e.state === 'strike') {
      if (!e.struck && e.stateT > 0.06) {
        e.struck = true;
        let range = 36;
        if (e.type === 'soldier') range = 46;
        else if (e.type === 'chariot') range = 70;
        else if (e.type === 'lotus') range = 50;
        else if (e.type === 'cyclops') range = 64;
        else if (e.type === 'boss') range = 54;

        if (d < range) {
          damagePlayer(e.dmg, Math.atan2(dy, dx));
        } else {
          burst(e.x + nx * 20, e.y + ny * 10, '#6b7793', 4, 0.5);
        }
        const sh = (e.type === 'cyclops' || e.type === 'chariot') ? 6
                 : (e.type === 'boss' ? 5 : (e.type === 'lotus' ? 3 : 2));
        game.shake = Math.max(game.shake, sh);
      }
      if (e.stateT > 0.22) {
        e.state = 'recover'; e.stateT = 0;
        e.atkCd = e.type === 'boss' ? 1.35
                : e.type === 'cyclops' ? 1.4
                : e.type === 'chariot' ? 1.5
                : e.type === 'soldier' ? 1.1
                : 1.05;
      }

    } else if (e.state === 'throwWind') {
      // 平民举石
      if (e.stateT > 0.35) { e.state = 'throw'; e.stateT = 0; e.struck = false; }

    } else if (e.state === 'throw') {
      if (!e.struck) {
        e.struck = true;
        if (d < 90) {
          damagePlayer(e.dmg, Math.atan2(dy, dx));
          burst(e.x + nx * 12, e.y - 6, '#a2926f', 5, 0.6);
        } else {
          burst(e.x + nx * 22, e.y + 4, '#a2926f', 4, 0.5);
        }
        game.shake = Math.max(game.shake, 1.5);
      }
      if (e.stateT > 0.2) {
        e.state = 'recover'; e.stateT = 0;
        e.atkCd = 2.2;
      }

    } else if (e.state === 'cast') {
      // 食莲人：忘忧花雾，范围内受伤并减速
      if (e.stateT > 0.55) {
        const dd = Math.hypot(player.x - e.x, player.y - e.y);
        if (dd < 88) {
          damagePlayer(e.dmg, Math.atan2(player.y - e.y, player.x - e.x));
          player.slowT = 2.6;
          addFloat(player.x, player.y - 26, 'DROWSY', '#a8e6a0');
        }
        for (let i = 0; i < 26; i++) {
          const ang = (i / 26) * Math.PI * 2;
          game.particles.push({
            x: e.x + Math.cos(ang) * 14,
            y: e.y + Math.sin(ang) * 14,
            vx: Math.cos(ang) * 130,
            vy: Math.sin(ang) * 130,
            life: 0.6, max: 0.6, size: 2,
            color: i % 2 ? '#e8a7c8' : '#8fd694',
            grav: 0,
          });
        }
        game.shake = Math.max(game.shake, 3);
        e.state = 'recover'; e.stateT = 0;
        e.atkCd = 1.4;
      }

    } else if (e.state === 'charge') {
      // 直线冲撞：独眼巨人 / 战车
      const chargeSpeed = e.type === 'chariot' ? 300 : 270;
      e.x += Math.cos(e.chargeAng) * chargeSpeed * dt;
      e.y += Math.sin(e.chargeAng) * chargeSpeed * dt;
      resolveEntity(e);

      if (!e.chargeHit && overlap(e, player)) {
        e.chargeHit = true;
        damagePlayer(e.type === 'chariot' ? e.dmg : e.dmg + 1, e.chargeAng);
        game.shake = Math.max(game.shake, 7);
      }
      if (e.stateT > (e.type === 'chariot' ? 0.5 : 0.45)) {
        e.state = 'recover'; e.stateT = 0;
        e.atkCd = 1.3;
        game.shake = Math.max(game.shake, 4);
      }

    } else if (e.state === 'recover') {
      const rt = (e.type === 'cyclops' || e.type === 'lotus' || e.type === 'chariot') ? 0.6 : 0.45;
      if (e.stateT > rt) { e.state = 'move'; e.stateT = 0; }
    }
  }

  function separateEnemies() {
    const es = game.enemies;
    for (let i = 0; i < es.length; i++) {
      const a = es[i];
      if (a.dead) continue;
      for (let j = i + 1; j < es.length; j++) {
        const b = es[j];
        if (b.dead) continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 0.01;
        const min = (a.r + b.r) * 0.85;
        if (d < min) {
          const push = (min - d) / 2;
          const nx = dx / d, ny = dy / d;
          a.x -= nx * push; a.y -= ny * push;
          b.x += nx * push; b.y += ny * push;
          resolveEntity(a); resolveEntity(b);
        }
      }
    }
  }

  // 玩家是否走到当前房间的出口门前
  function playerAtExit() {
    const p = player;
    const d = game.exitDir;
    if (!d) return false;
    if (d === 'north') return Math.abs(p.x - 240) < 28 && p.y < 46;
    if (d === 'south') return Math.abs(p.x - 240) < 28 && p.y > ROOM.b - 36;
    if (d === 'west') return Math.abs(p.y - 135) < 26 && p.x < ROOM.l + 38;
    return Math.abs(p.y - 135) < 26 && p.x > ROOM.r - 38;
  }

  /* =========================================================
     11. 主更新
     ========================================================= */
  function update(dt) {
    if (game.mode === 'paused' || game.mode === 'map' || game.mode === 'settings') return;

    // 命中顿帧：命中瞬间短暂定住画面，强化打击感
    if (game.hitstop > 0) {
      game.hitstop = Math.max(0, game.hitstop - dt);
      return;
    }

    game.time += dt;

    // 战败过场：打赢守将，但援军抵达，被迫撤离
    if (game.mode === 'defeat') {
      game.defeat.t += dt;
      if (game.defeat.t >= game.defeat.max) {
        game.mode = 'play';
        game.defeat = null;
        startSail(game.level + 1);
      }
      return;
    }

    // 幕间海上过场
    if (game.mode === 'sail') {
      const tr = game.transition;
      tr.t += dt;
      if (tr.t >= tr.max) {
        game.mode = 'play';
        game.transition = null;
        startFloor(tr.next);
      }
      return;
    }

    game.shake *= Math.exp(-9 * dt);
    if (game.shake < 0.04) game.shake = 0;
    game.hurtFlash = Math.max(0, game.hurtFlash - dt * 2.4);
    game.fade = Math.max(0, game.fade - dt * 2.2);
    game.hintT = Math.max(0, game.hintT - dt);
    if (game.banner) {
      game.banner.t -= dt;
      if (game.banner.t <= 0) game.banner = null;
    }
    if (game.itemBanner) {
      game.itemBanner.t += dt;
      if (game.itemBanner.t >= game.itemBanner.max) game.itemBanner = null;
    }

    // 粒子
    for (let i = game.particles.length - 1; i >= 0; i--) {
      const p = game.particles[i];
      p.life -= dt;
      if (p.life <= 0) { game.particles.splice(i, 1); continue; }
      p.vy += p.grav * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= Math.exp(-2 * dt);
    }

    // 飘字
    for (let i = game.floats.length - 1; i >= 0; i--) {
      const f = game.floats[i];
      f.t -= dt;
      f.y -= 24 * dt;
      if (f.t <= 0) game.floats.splice(i, 1);
    }

    if (game.mode !== 'play') return;

    // 首领房演出期间冻结战斗
    if (game.intro) {
      game.intro.t += dt;
      if (game.intro.t >= game.intro.max) {
        game.intro = null;
        if (game.introBanner) {
          game.banner = game.introBanner;
          game.introBanner = null;
        }
      }
      return;
    }

    updatePlayer(dt);
    updateArrows(dt);
    updatePickups(dt);
    for (let i = 0; i < game.enemies.length; i++) updateEnemy(game.enemies[i], dt);
    separateEnemies();

    game.enemies = game.enemies.filter(function (e) { return !e.dead || e.deadT < 0.5; });

    // 逐个刷怪
    if (game.pending.length) {
      game.spawnTimer -= dt;
      if (game.spawnTimer <= 0) {
        const type = game.pending.shift();
        const pos = findSpawnPos();
        spawnEnemy(type, pos.x, pos.y);
        game.spawnTimer = 0.4;
      }
    }

    // 清场开门
    const alive = game.enemies.some(function (e) { return !e.dead; });
    if (!game.pending.length && !alive) {
      // 首领掉落的道具还没捡：先等玩家走过去
      if (game.reward) {
        updateReward(dt);
        if (game.reward) return;
      }
      // 捡起后留一点缓冲，让拾取提示播完
      if (game.rewardHold > 0) {
        game.rewardHold = Math.max(0, game.rewardHold - dt);
        return;
      }

      if (!game.doorOpen) {
        const room = game.rooms[game.roomIndex];

        // 首领房：先掉一件道具，拾取后再决定开门还是进过场
        if (room.type === 'boss' && !game.rewardRolled) {
          game.rewardRolled = true;
          const key = rollItem();
          if (key) {
            game.reward = { key: key, x: 240, y: 152, t: 0 };
            game.banner = { text: 'A GIFT FROM THE GODS', t: 2.2, max: 2.2 };
            Sfx.reward();
            return;
          }
        }

        if (room.afterBoss === 'defeat') {
          // 击败守将，但援军压境：进入战败过场，不开门
          game.mode = 'defeat';
          game.defeat = { t: 0, max: 4.8 };
          Sfx.defeat();
          return;
        }
        game.doorOpen = true;
        // 清空房间恢复 1 点生命
        if (player.hp < player.maxHp) {
          player.hp = Math.min(player.maxHp, player.hp + 1);
          addFloat(player.x, player.y - 28, '+1 HP', '#79d6a0');
        }
        game.banner = { text: 'WAY UNSEALED', t: 1.8, max: 1.8 };
        Sfx.door();
      }
      // 走入传送门，前往地图上的下一个节点
      if (playerAtExit()) {
        game.fade = 1;
        advanceRoom();
      }
    }
  }

  // 首领掉落的道具：底座上的图标，走近 22 px 自动拾取
  function updateReward(dt) {
    const r = game.reward;
    r.t += dt;
    if (Math.hypot(player.x - r.x, player.y - (r.y - 8)) < 22) {
      if (applyItem(r.key)) {
        game.itemBanner = { key: r.key, t: 0, max: 2.4 };
        game.rewardHold = 1.6;
        Sfx.reward();
        burst(r.x, r.y - 10, '#ffd166', 14, 0.9);
        burst(r.x, r.y - 10, '#eef4ff', 8, 0.6);
        game.shake = Math.max(game.shake, 3);
        writeSave();
      }
      game.reward = null;
    }
  }

  /* =========================================================
     12. 场景绘制
     ========================================================= */
  function drawRoom() {
    if (game.theme === 'shore') drawShoreRoom();
    else if (game.theme === 'cliff') drawCliffRoom();
    else if (game.theme === 'city') drawCityRoom();
    else drawCaveRoom();
  }

  // 洞窟：手绘岩地 + 石柱 + 火把
  function drawCaveRoom() {
    // 地板
    HandArt.drawRockFloor(ctx);

    // 边框墙
    const { l, t, r, b } = ROOM;
    ctx.fillStyle = C.wall;
    ctx.fillRect(0, 0, W, t);
    ctx.fillRect(0, b, W, H - b);
    ctx.fillRect(0, t, l, b - t);
    ctx.fillRect(r, t, W - r, b - t);

    // 砖缝
    ctx.fillStyle = C.wallDark;
    for (let y = 0; y < t; y += 7) ctx.fillRect(0, y, W, 1);
    for (let y = b; y < H; y += 7) ctx.fillRect(0, y, W, 1);
    for (let y = t; y < b; y += 7) {
      ctx.fillRect(0, y, l, 1);
      ctx.fillRect(r, y, W - r, 1);
    }
    for (let y = 0; y < t; y += 7) {
      const off = ((y / 7) | 0) % 2 ? 0 : 8;
      for (let x = off; x < W; x += 16) ctx.fillRect(x, y, 1, 7);
    }

    // 内沿高光，让墙体有厚度
    ctx.fillStyle = C.wallLight;
    ctx.fillRect(l - 2, t, 2, b - t);
    ctx.fillRect(r, t, 2, b - t);
    ctx.fillRect(l, t - 2, r - l, 2);

    // 石柱
    for (let i = 0; i < OBSTACLES.length; i++) drawPillar(OBSTACLES[i]);

    // 火把
    for (let i = 0; i < TORCHES.length; i++) drawTorch(TORCHES[i]);
  }

  // 城池：手绘石板路 + 断墙 + 木箱 + 燃烧的残骸
  function drawCityRoom() {
    HandArt.drawCityFloor(ctx);

    drawCityWall();

    for (let i = 0; i < OBSTACLES.length; i++) drawCrate(OBSTACLES[i]);
    for (let i = 0; i < TORCHES.length; i++) drawBrazier(TORCHES[i]);

    drawRubbleFire(148, 58);
    drawRubbleFire(332, 212);
  }

  // 城池边界：断裂的石墙与木梁
  function drawCityWall() {
    const l = ROOM.l, t = ROOM.t, r = ROOM.r, b = ROOM.b;

    ctx.fillStyle = '#3a352e';
    ctx.fillRect(0, 0, W, t);
    ctx.fillRect(0, b, W, H - b);
    ctx.fillRect(0, t, l, b - t);
    ctx.fillRect(r, t, W - r, b - t);

    for (let x = 0; x < W; x += 12) {
      const h = hash(x, 3);
      ctx.fillStyle = h > 0.5 ? '#4a443b' : '#575047';
      ctx.fillRect(x, 0, 11, t);
      ctx.fillRect(x, b, 11, H - b);
    }
    for (let y = t; y < b; y += 12) {
      const h = hash(y, 7);
      ctx.fillStyle = h > 0.5 ? '#4a443b' : '#575047';
      ctx.fillRect(0, y, l, 11);
      ctx.fillRect(r, y, W - r, 11);
    }

    // 木梁
    ctx.fillStyle = '#4a3524';
    ctx.fillRect(0, t - 5, W, 2);
    ctx.fillRect(l - 5, t, 2, b - t);

    ctx.fillStyle = 'rgba(20, 16, 12, 0.4)';
    ctx.fillRect(l - 1, t, 1, b - t);
    ctx.fillRect(r, t, 1, b - t);
    ctx.fillRect(l, t - 1, r - l, 1);
  }

  // 木箱：替代石柱
  function drawCrate(o) {
    const x = o.x, y = o.y, w = o.w, h = o.h;

    ctx.fillStyle = 'rgba(20, 16, 10, 0.32)';
    ctx.fillRect(x - 2, y + h - 2, w + 4, 4);

    px(x + 1, y + 2, w - 2, h - 3, '#6b4a2a');
    px(x + 1, y + 2, w - 2, 3, '#8a6132');
    px(x + 3, y + 5, w - 6, h - 8, '#7d5834');

    px(x + 1, y + 2, w - 2, 1, '#4a3020');
    px(x + 1, y + h - 2, w - 2, 1, '#4a3020');
    px(x + 1, y + 2, 1, h - 3, '#4a3020');
    px(x + w - 2, y + 2, 1, h - 3, '#4a3020');

    px(x + 5, y + 8, w - 10, 1, '#5c3f26');
    px(x + 9, y + 4, 1, h - 6, '#5c3f26');
  }

  // 可破坏酒桶：上窄下窄、中间鼓起的桶身 + 两道蓝灰铁箍
  function drawBarrel(b) {
    const x = Math.round(b.x), y = Math.round(b.y);
    const top = y - 20;

    ctx.fillStyle = 'rgba(16, 12, 8, 0.36)';
    ctx.fillRect(x - 8, y - 2, 16, 4);

    // 桶身：上窄、中鼓、下窄
    px(x - 6, top + 2, 12, 4, '#a06a38');
    px(x - 7, top + 5, 14, 3, '#c08a4c');
    px(x - 8, top + 8, 16, 7, '#b07a42');
    px(x - 7, top + 15, 14, 3, '#c08a4c');
    px(x - 6, top + 18, 12, 2, '#9a6432');

    // 桶盖
    px(x - 5, top, 10, 2, '#d9a660');
    px(x - 4, top - 1, 8, 1, '#e8c07a');

    // 左侧受光
    px(x - 5, top + 5, 2, 11, '#d9a660');

    // 两道铁箍
    px(x - 8, top + 7, 16, 2, '#4a5566');
    px(x - 8, top + 14, 16, 2, '#4a5566');
    px(x - 8, top + 7, 16, 1, '#7f8da3');
    px(x - 8, top + 14, 16, 1, '#6d7a90');

    // 桶底
    px(x - 6, y - 2, 12, 2, '#5c3a1e');
  }

  // 掉落物：金币与红心，带落地弹跳和即将消失时的闪烁
  function drawPickups() {
    for (let i = 0; i < game.pickups.length; i++) {
      const p = game.pickups[i];
      if (p.life < 3 && Math.sin(game.time * 22) < 0) continue;

      const x = Math.round(p.x), y = Math.round(p.y);
      const gy = y - Math.round(p.z);

      ctx.fillStyle = 'rgba(10, 8, 6, 0.34)';
      ctx.fillRect(x - 4, y - 1, 8, 3);

      if (p.type === 'coin') {
        px(x - 3, gy - 7, 6, 7, '#c9902c');
        px(x - 2, gy - 7, 4, 7, '#ffd166');
        px(x - 1, gy - 6, 1, 5, '#fff3c4');
      } else {
        px(x - 4, gy - 6, 3, 3, '#e8483c');
        px(x + 1, gy - 6, 3, 3, '#e8483c');
        px(x - 3, gy - 4, 6, 3, '#c8302a');
        px(x - 2, gy - 1, 4, 2, '#c8302a');
        px(x - 1, gy + 1, 2, 1, '#c8302a');
        px(x - 4, gy - 6, 1, 1, '#ff9a8e');
      }
    }
  }

  // 首领掉落的道具底座：石台 + 上下浮动的图标 + 暖光
  function drawReward() {
    const r = game.reward;
    const x = Math.round(r.x), y = Math.round(r.y);

    const g = ctx.createRadialGradient(x, y - 14, 2, x, y - 14, 30);
