    drawItemIcon(r.key, x, y - 13 + bob, 2);
  }

  // 拾取演出：屏幕上方弹出道具名与效果
  function drawItemBanner() {
    const b = game.itemBanner;
    const k = b.t / b.max;
    let a = 1;
    if (k < 0.12) a = k / 0.12;
    else if (k > 0.8) a = (1 - k) / 0.2;
    const it = ITEMS[b.key];
    if (!it) return;

    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.fillStyle = 'rgba(8, 10, 16, 0.88)';
    ctx.fillRect(W / 2 - 108, 56, 216, 92);
    ctx.strokeStyle = '#c8a35e';
    ctx.lineWidth = 1;
    ctx.strokeRect(W / 2 - 107.5, 56.5, 215, 91);

    drawItemIcon(b.key, W / 2, 82, 3);
    pixelText(it.name, W / 2, 116, 1, '#ffd166', 'center');
    pixelText(it.desc, W / 2, 130, 1, '#9db0cd', 'center');
    ctx.globalAlpha = 1;
  }

  // 燃烧的残骸：给城池一点火光与破坏感
  function drawRubbleFire(x, y) {
    px(x - 11, y + 2, 22, 6, '#2f2a24');
    px(x - 7, y - 2, 14, 6, '#3a332b');

    const flick = 0.8 + hash((game.time * 8) | 0, x) * 0.4;
    const rad = 46 * flick;
    const g = ctx.createRadialGradient(x, y - 2, 2, x, y - 2, rad);
    g.addColorStop(0, 'rgba(255, 150, 70, 0.34)');
    g.addColorStop(0.5, 'rgba(255, 110, 40, 0.12)');
    g.addColorStop(1, 'rgba(255, 90, 20, 0)');
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = g;
    ctx.fillRect(x - rad, y - 2 - rad, rad * 2, rad * 2);
    ctx.globalCompositeOperation = 'source-over';

    const wob = Math.round(Math.sin(game.time * 10 + x) * 1);
    px(x - 4, y - 6 + wob, 8, 8, '#ff7a2b');
    px(x - 2, y - 10 - wob, 5, 8, '#ffb545');
    px(x - 1, y - 5, 3, 5, '#ffe9a8');
  }

  // 海岸：手绘沙地 + 草簇 + 小花 + 棕榈 + 灌木边界
  function drawShoreRoom() {
    HandArt.drawSandFloor(ctx);

    drawBushBorder('#3f5738', '#4d6942', '#31452c');

    for (let i = 0; i < OBSTACLES.length; i++) drawPalm(OBSTACLES[i]);
    for (let i = 0; i < TORCHES.length; i++) drawBrazier(TORCHES[i]);

    drawLotusPatch(96, 208);
    drawLotusPatch(384, 208);
    drawLotusPatch(240, 232);
  }

  // 岩滩：手绘岩石地面 + 干草 + 礁石边界
  function drawCliffRoom() {
    HandArt.drawCliffFloor(ctx);

    drawCliffBorder();

    for (let i = 0; i < OBSTACLES.length; i++) drawRock(OBSTACLES[i]);
    for (let i = 0; i < TORCHES.length; i++) drawBrazier(TORCHES[i]);
  }

  // 岩滩边界：堆叠的不规则岩块
  function drawCliffBorder() {
    const l = ROOM.l, t = ROOM.t, r = ROOM.r, b = ROOM.b;

    ctx.fillStyle = '#3a372f';
    ctx.fillRect(0, 0, W, t);
    ctx.fillRect(0, b, W, H - b);
    ctx.fillRect(0, t, l, b - t);
    ctx.fillRect(r, t, W - r, b - t);

    for (let x = 0; x < W; x += 12) {
      const h = hash(x, 11);
      ctx.fillStyle = h > 0.5 ? '#4e4a40' : '#5b564a';
      const bh = 7 + ((h * 8) | 0);
      ctx.fillRect(x, t - bh, 11, bh + 2);
      ctx.fillRect(x, b - 2, 11, bh);
    }
    for (let y = t; y < b; y += 12) {
      const h = hash(y, 13);
      ctx.fillStyle = h > 0.5 ? '#4e4a40' : '#5b564a';
      const bw = 7 + ((h * 8) | 0);
      ctx.fillRect(l - bw, y, bw + 2, 11);
      ctx.fillRect(r - 2, y, bw, 11);
    }

    ctx.fillStyle = 'rgba(24, 22, 18, 0.35)';
    ctx.fillRect(l - 1, t, 1, b - t);
    ctx.fillRect(r, t, 1, b - t);
    ctx.fillRect(l, t - 1, r - l, 1);
  }

  // 室外房间的边界：低矮的灌木与岩石带
  function drawBushBorder(base, light, dark) {
    const l = ROOM.l, t = ROOM.t, r = ROOM.r, b = ROOM.b;

    ctx.fillStyle = dark;
    ctx.fillRect(0, 0, W, t);
    ctx.fillRect(0, b, W, H - b);
    ctx.fillRect(0, t, l, b - t);
    ctx.fillRect(r, t, W - r, b - t);

    for (let x = 0; x < W; x += 5) {
      const h = hash(x, 5);
      ctx.fillStyle = h > 0.5 ? base : light;
      ctx.fillRect(x, t - 3 - ((h * 3) | 0), 4, 4);
      ctx.fillRect(x, b + ((h * 3) | 0), 4, 4);
    }
    for (let y = t; y < b; y += 5) {
      const h = hash(y, 9);
      ctx.fillStyle = h > 0.5 ? base : light;
      ctx.fillRect(l - 3 - ((h * 3) | 0), y, 4, 4);
      ctx.fillRect(r + ((h * 3) | 0), y, 4, 4);
    }

    ctx.fillStyle = 'rgba(30, 40, 26, 0.32)';
    ctx.fillRect(l - 1, t, 1, b - t);
    ctx.fillRect(r, t, 1, b - t);
    ctx.fillRect(l, t - 1, r - l, 1);
  }

  // 棕榈：俯视树冠 + 短树干
  function drawPalm(o) {
    const cx = o.x + o.w / 2;
    const cy = o.y + o.h / 2;

    ctx.fillStyle = 'rgba(60, 50, 30, 0.28)';
    ctx.beginPath();
    ctx.ellipse(cx, cy + 9, 15, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    px(cx - 2, cy - 2, 4, 13, '#7a5a36');
    px(cx - 2, cy - 2, 2, 13, '#8f6c42');

    px(cx - 11, cy - 5, 8, 3, '#4f7a3f');
    px(cx + 3, cy - 5, 8, 3, '#4f7a3f');
    px(cx - 8, cy - 10, 7, 3, '#5d8a48');
    px(cx + 1, cy - 10, 7, 3, '#5d8a48');
    px(cx - 13, cy - 1, 5, 3, '#436b36');
    px(cx + 8, cy - 1, 5, 3, '#436b36');
    px(cx - 4, cy - 13, 3, 5, '#5d8a48');
    px(cx + 1, cy - 13, 3, 5, '#4f7a3f');
    px(cx - 3, cy - 6, 6, 5, '#3b5f31');
  }

  // 岩石：替代石柱
  function drawRock(o) {
    ctx.fillStyle = 'rgba(20, 18, 14, 0.3)';
    ctx.beginPath();
    ctx.ellipse(o.x + o.w / 2, o.y + o.h - 1, o.w / 2 + 2, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    px(o.x + 1, o.y + 6, o.w - 2, o.h - 7, '#5c584e');
    px(o.x + 3, o.y + 3, o.w - 6, o.h - 5, '#6e695c');
    px(o.x + 4, o.y + 4, o.w - 9, 4, '#7f7a6b');
    px(o.x + 8, o.y + 9, 1, 6, '#4b473f');
    px(o.x + 12, o.y + 7, 1, 4, '#565247');
  }

  // 火盆：室外照明
  function drawBrazier(t) {
    const flick = 0.8 + hash((game.time * 9) | 0, t.x) * 0.4;
    const rad = 58 * flick;
    const g = ctx.createRadialGradient(t.x, t.y + 2, 2, t.x, t.y + 2, rad);
    g.addColorStop(0, 'rgba(255, 200, 120, 0.32)');
    g.addColorStop(0.5, 'rgba(255, 160, 80, 0.12)');
    g.addColorStop(1, 'rgba(255, 140, 60, 0)');
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = g;
    ctx.fillRect(t.x - rad, t.y + 2 - rad, rad * 2, rad * 2);
    ctx.globalCompositeOperation = 'source-over';

    px(t.x - 6, t.y + 1, 12, 5, '#6b6459');
    px(t.x - 5, t.y, 10, 2, '#857d6f');
    px(t.x - 4, t.y + 4, 8, 2, '#514b42');

    const wob = Math.round(Math.sin(game.time * 12 + t.x) * 1);
    px(t.x - 4, t.y - 5 + wob, 8, 6, '#ff8a2b');
    px(t.x - 2, t.y - 8 - wob, 5, 8, '#ffb545');
    px(t.x - 1, t.y - 4, 3, 5, '#ffe9a8');
  }

  function drawLotusPatch(x, y) {
    px(x - 6, y + 2, 12, 3, '#4d8358');
    px(x - 2, y, 2, 2, '#e8a7c8');
    px(x + 1, y - 1, 2, 2, '#f2bfd8');
    px(x + 4, y + 1, 2, 2, '#e8a7c8');
    px(x, y + 1, 1, 1, '#ffd166');
  }

  function drawPillar(o) {
    const w = o.w, h = o.h;
    // 落影
    ctx.fillStyle = '#12161f';
    ctx.fillRect(o.x - 3, o.y + h - 1, w + 6, 4);

    // 柱基
    ctx.fillStyle = '#4e473e';
    ctx.fillRect(o.x - 2, o.y + h - 5, w + 4, 5);
    ctx.fillStyle = '#6d6457';
    ctx.fillRect(o.x - 2, o.y + h - 5, w + 4, 1);

    // 柱身
    ctx.fillStyle = '#403a33';
    ctx.fillRect(o.x + 2, o.y + 4, w - 4, h - 9);
    ctx.fillStyle = '#5a5146';
    ctx.fillRect(o.x + 2, o.y + 4, w - 7, h - 9);
    ctx.fillStyle = '#332e29';
    ctx.fillRect(o.x + 8, o.y + 5, 1, h - 11);
    ctx.fillRect(o.x + 13, o.y + 5, 1, h - 11);

    // 柱头
    ctx.fillStyle = '#5a5146';
    ctx.fillRect(o.x - 2, o.y, w + 4, 5);
    ctx.fillStyle = '#7d7263';
    ctx.fillRect(o.x - 2, o.y, w + 4, 2);
  }

  function drawTorch(t) {
    // 托架
    ctx.fillStyle = '#5a3f24';
    ctx.fillRect(t.x - 1, t.y + 1, 3, 8);
    ctx.fillStyle = '#7a5732';
    ctx.fillRect(t.x - 2, t.y, 5, 2);

    // 动态光晕
    const flick = 0.82 + hash((game.time * 9) | 0, t.x) * 0.35;
    const rad = 52 * flick;
    const g = ctx.createRadialGradient(t.x, t.y + 6, 2, t.x, t.y + 6, rad);
    g.addColorStop(0, 'rgba(255, 170, 70, 0.30)');
    g.addColorStop(0.45, 'rgba(255, 130, 40, 0.12)');
    g.addColorStop(1, 'rgba(255, 110, 20, 0)');
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = g;
    ctx.fillRect(t.x - rad, t.y + 6 - rad, rad * 2, rad * 2);
    ctx.globalCompositeOperation = 'source-over';

    // 火焰像素
    const wob = Math.round(Math.sin(game.time * 11 + t.x) * 1);
    px(t.x - 3, t.y + 2 + wob, 6, 5, '#ff8a2b');
    px(t.x - 2, t.y + 1 - wob, 4, 6, '#ffb545');
    px(t.x - 1, t.y + 3, 2, 4, '#ffe9a8');
  }

  const DOOR_ROT = { north: 0, south: Math.PI, west: -Math.PI / 2, east: Math.PI / 2 };

  // 四向门：朝向与地图上相邻节点的方向一致
  function drawDoor(dir, open) {
    if (!dir) return;

    let x = 240, y = ROOM.t;
    if (dir === 'south') y = ROOM.b;
    else if (dir === 'west') { x = ROOM.l; y = 135; }
    else if (dir === 'east') { x = ROOM.r; y = 135; }

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(DOOR_ROT[dir]);

    // 门洞：洞窟是深色岩缝，室外是灌木与岩壁的缺口
    const cave = game.theme === 'cave';
    ctx.fillStyle = cave ? '#090d16' : '#2a3524';
    ctx.fillRect(-20, -18, 40, 40);
    ctx.fillStyle = open
      ? (cave ? '#101728' : '#35472f')
      : (cave ? '#151c2b' : '#2f3d29');
    ctx.fillRect(-16, -14, 32, 34);

    // 门框
    ctx.fillStyle = open
      ? (cave ? '#4b5873' : '#6b7d55')
      : (cave ? '#333c4e' : '#46543a');
    ctx.fillRect(-22, -20, 3, 42);
    ctx.fillRect(19, -20, 3, 42);
    ctx.fillRect(-22, -22, 44, 3);
    ctx.fillRect(-22, 20, 44, 2);

    if (open) {
      const g = ctx.createLinearGradient(0, -14, 0, 22);
      g.addColorStop(0, 'rgba(120, 200, 255, 0.55)');
      g.addColorStop(1, 'rgba(90, 160, 255, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(-16, -14, 32, 36);

      for (let i = 0; i < 5; i++) {
        const ph = (game.time * 0.7 + i * 0.2) % 1;
        const py = 18 - ph * 32;
        ctx.fillStyle = 'rgba(160, 220, 255, ' + ((1 - ph) * 0.8).toFixed(2) + ')';
        ctx.fillRect(-10 + ((i * 7) % 20), Math.round(py), 2, 2);
      }
    }
    ctx.restore();

    // 提示文字固定在屏幕上，不随门旋转
    if (open && Math.sin(game.time * 5) > 0) {
      let tx = 240, ty = 48;
      if (dir === 'south') ty = ROOM.b - 46;
      else if (dir === 'west') { tx = ROOM.l + 62; ty = 152; }
      else if (dir === 'east') { tx = ROOM.r - 62; ty = 152; }
      text('ENTER', tx, ty, 8, '#9fd3ff', 'center');
    }
  }

  /* =========================================================
     13. 角色绘制
     ========================================================= */
  // 走/站混合值：起步和停步之间做缓动，避免姿态瞬间切换
  let heroWalkBlend = 0;

  function drawHero() {
    const p = player;
    if (p.state === 'dead') return;

    const x = Math.round(p.x), y = Math.round(p.y);

    // 步态混合：目标 0=站 1=走，每帧插值过去
    heroWalkBlend += ((p.state === 'walk' ? 1 : 0) - heroWalkBlend) * 0.22;

    // 阴影：跟着步频收缩、变淡，脚抬起时影子更小
    const walkStep = heroWalkBlend * Math.abs(Math.sin(p.animT * 12));
    ctx.save();
    ctx.globalAlpha = 0.34 - walkStep * 0.12;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(x, y + 17, 13 - walkStep * 1.6, 4.6 - walkStep * 0.7, 0, 0, 6.3);
    ctx.fill();
    ctx.restore();

    // 受伤无敌帧闪烁
    if (p.invuln > 0 && Math.floor(p.invuln * 26) % 2 === 0) return;

    const flip = p.face === 'left';
    const artFace = flip ? 'right' : p.face;

    // 手绘身体：一体剪影，缩放后约 26×45 逻辑像素
    ctx.save();
    ctx.translate(x, y);
    if (flip) ctx.scale(-1, 1);
    HandArt.drawHero(ctx, 0, 0, p.animT, {
      face: artFace,
      walk: p.state === 'walk',
      walkBlend: heroWalkBlend,
      animT: p.animT,
      scale: 0.72
    });
    ctx.restore();

    // 武器：沿用像素块绘制，坐标仍是 1 格 × SPRITE_SCALE
    ctx.save();
    ctx.translate(x, y);
    if (flip) ctx.scale(-1, 1);
    ctx.scale(SPRITE_SCALE, SPRITE_SCALE);
    ctx.translate(-2, 0);

    const walking = p.state === 'walk';
    const bob = walking ? (Math.round(Math.sin(p.animT * 14)) > 0 ? -1 : 0) : 0;

    // 佩剑：待机 / 行走 / 受伤时握在右手，剑尖朝下
    if (p.state !== 'attack' && !p.blocking && p.bowT < 0 && p.bowCd <= 0) {
      ctx.save();
      ctx.translate(0, -6);
      px(5, 0 + bob, 2, 4, '#6b4a24');   // 握柄
      px(4, 4 + bob, 4, 1, '#c9a05a');   // 护手
      px(5, 5 + bob, 2, 5, '#a9b6cc');   // 剑身
      px(5, 5 + bob, 1, 5, '#eaf3ff');   // 受光面
      px(5, 10 + bob, 2, 1, '#ffffff');  // 剑尖
      ctx.restore();
    }

    // 弓：拉弓与射后冷却期间都拿在手上，越拉越满
    if (p.bowT >= 0 || p.bowCd > 0) {
      const k = p.bowT >= 0 ? clamp(p.bowT / p.bowWindup, 0, 1) : 0;
      const pull = Math.round(1 + k * 3);
      px(5, -8 + bob, 2, 1, '#c9a05a');       // 上弓梢
      px(6, -7 + bob, 1, 4, '#8a6132');       // 弓臂
      px(5, -3 + bob, 1, 6, '#8a6132');       // 弓腹
      px(6, 3 + bob, 1, 4, '#8a6132');
      px(5, 7 + bob, 2, 1, '#c9a05a');        // 下弓梢
      px(6 - pull, -6 + bob, 1, 13, '#e8dcc0'); // 弦
      px(6 - pull, -1 + bob, 4, 1, '#e8d8ad'); // 搭箭
    }

    // 盾牌
    if (p.blocking) {
      px(4, -5 + bob, 6, 10, '#b89454');
      px(4, -5 + bob, 6, 1, '#e8d8ad');
      px(4, 4 + bob, 6, 1, '#7a6038');
      px(6, -2 + bob, 2, 5, '#7a6038');
    }

    ctx.restore();
  }

  // 挥砍进度：起手回引 → 劈砍爆发 → 收招回带
  function swingCurve(t) {
    if (t < ATK_WINDUP) {
      const k = t / ATK_WINDUP;
      return -0.14 * (k * k * (3 - 2 * k));
    }
    if (t < ATK_SLASH) {
      const k = (t - ATK_WINDUP) / (ATK_SLASH - ATK_WINDUP);
      return -0.14 + 1.14 * (1 - Math.pow(1 - k, 2.3));
    }
    const k = (t - ATK_SLASH) / (1 - ATK_SLASH);
    return 1 - 0.07 * k;              // 收招：顺着惯性回带一点
  }

  // 挥剑刀光（世界坐标 + 旋转，叠在最上层）
  function drawSwing() {
    const p = player;
    if (p.state !== 'attack') return;

    const t = clamp(p.attackT / ATK_DUR, 0, 1);
    const fa = faceAngle(p.atkFace || p.face);
    const span = 1.8;                     // 挥砍总角度（约 103°），只扫身前一段
    const dir = p.atkFace === 'left' ? -1 : 1;   // 朝左时整条刀光镜像，保持自上而下劈
    const angAt = function (e) { return fa + dir * (-span / 2 + e * span); };
    const q = swingCurve(t);

    // 剑身角度：起手从待机的垂剑位置抬到斜后上方（走最短路径，不做绕身回环）
    let ba;
    if (t < ATK_WINDUP) {
      const k = t / ATK_WINDUP;
      const sm = k * k * (3 - 2 * k);
      const from = Math.PI / 2;           // 待机时剑尖朝下
      const diff = Math.atan2(Math.sin(angAt(-0.14) - from), Math.cos(angAt(-0.14) - from));
      ba = from + diff * sm;
    } else {
      ba = angAt(q);
    }

    const da = Math.atan2(Math.sin(ba - fa), Math.cos(ba - fa));
    const aa = fa + da * 0.62;            // 手臂摆幅略小于剑身
    const cx = Math.round(p.x + Math.cos(fa) * 2);
    const cy = Math.round(p.y - 8 + Math.sin(fa) * 2);
    // 刀光圆心略向身前推，避免弧线横跨身体左右
    const gx = cx + Math.cos(fa) * 8;
    const gy = cy + Math.sin(fa) * 8;
    // 刀光强度：起手不可见，劈砍最亮，收招淡出
    const glow = t < ATK_WINDUP ? 0 : (t < ATK_SLASH ? 1 : Math.max(0, 1 - (t - ATK_SLASH) / 0.24));

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';

    if (glow > 0) {
      // 同一半径上拼出四段：尾部宽而淡、前缘窄而亮，形成一条月牙拖尾
      const trail = 0.46;
      for (let i = 0; i < 4; i++) {
        const k1 = (i + 1) / 4;
        const e1 = q - trail * (1 - k1);
        if (e1 <= 0) continue;
        const e0 = Math.max(0, q - trail * (1 - i / 4));
        const A = angAt(e0), B = angAt(e1);
        ctx.strokeStyle = 'rgba(150, 214, 255, ' + ((0.10 + 0.46 * k1) * glow).toFixed(3) + ')';
        ctx.lineWidth = Math.round(11 - 9 * k1);
        ctx.beginPath();
        ctx.arc(gx, gy, 26, Math.min(A, B), Math.max(A, B));
        ctx.stroke();
      }

      // 剑锋亮边（q 太小时不画，避免弧的起止角反转）
      if (q > 0.07) {
        const A = angAt(q - 0.07);
        ctx.strokeStyle = 'rgba(255, 255, 255, ' + (0.95 * glow).toFixed(3) + ')';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(gx, gy, 27, Math.min(A, ba), Math.max(A, ba));
        ctx.stroke();
      }
    }

    ctx.globalCompositeOperation = 'source-over';

    // 挥剑的手臂
    ctx.translate(cx, cy);
    ctx.rotate(aa);
    ctx.scale(SPRITE_SCALE, SPRITE_SCALE);
    ctx.fillStyle = '#5f2a26';
    ctx.fillRect(0, -2, 4, 4);
    ctx.fillStyle = C.skin;
    ctx.fillRect(4, -2, 2, 4);
    ctx.restore();

    // 剑身：从手的位置沿挥砍角度伸出
    const hx = Math.round(cx + Math.cos(aa) * 10);
    const hy = Math.round(cy + Math.sin(aa) * 10);
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(ba);
    ctx.scale(SPRITE_SCALE, SPRITE_SCALE);
    ctx.fillStyle = '#7a5528';
    ctx.fillRect(-3, -1, 3, 2);       // 握柄
    ctx.fillStyle = '#c9a05a';
    ctx.fillRect(0, -3, 2, 6);        // 护手
    ctx.fillStyle = '#9aa7bd';
    ctx.fillRect(2, -1, 9, 2);        // 剑身
    ctx.fillStyle = '#eaf3ff';
    ctx.fillRect(2, -1, 9, 1);        // 受光面
    ctx.fillStyle = '#6c7a94';
    ctx.fillRect(2, 1, 9, 1);         // 背光面
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(11, -1, 2, 2);       // 剑尖

    ctx.restore();
  }

  // 箭矢
  function drawArrows() {
    for (let i = 0; i < game.arrows.length; i++) {
      const ar = game.arrows[i];
      const x = Math.round(ar.x), y = Math.round(ar.y);
      const dx = Math.cos(ar.ang), dy = Math.sin(ar.ang);

      // 飞行拖尾
      ctx.strokeStyle = 'rgba(255, 236, 190, 0.30)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x - dx * 22, y - dy * 22);
      ctx.lineTo(x - dx * 6, y - dy * 6);
      ctx.stroke();

      // 箭杆与箭头
      ctx.strokeStyle = '#e8d8ad';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x - dx * 7, y - dy * 7);
      ctx.lineTo(x, y);
      ctx.stroke();

      ctx.fillStyle = '#f7f4e8';
      ctx.fillRect(x - 1, y - 1, 2, 2);
    }
  }

  function drawEnemy(e) {
    const x = Math.round(e.x), y = Math.round(e.y);
    const big = e.type === 'boss' || e.type === 'lotus' || e.type === 'cyclops' || e.type === 'chariot';

    // 出生动画
    if (e.spawnT > 0) {
      const k = 1 - e.spawnT / 0.45;
      ctx.strokeStyle = 'rgba(150, 120, 255, ' + (0.25 + k * 0.5).toFixed(2) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(x, y + 4, 8 + (1 - k) * 16, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.save();
    if (e.spawnT > 0) ctx.globalAlpha = 0.35 + (1 - e.spawnT / 0.45) * 0.65;
    if (e.dead) ctx.globalAlpha = Math.max(0, 1 - e.deadT / 0.5);

    // 阴影
    const shadowW = e.type === 'cyclops' ? 30 : (e.type === 'chariot' ? 42 : (e.type === 'lotus' ? 26 : (e.type === 'boss' ? 20 : e.w)));
    ctx.fillStyle = 'rgba(0,0,0,0.34)';
    ctx.fillRect(x - shadowW, y + e.h / 2 + 4, shadowW * 2, 5);

    // 预警圈
    if (e.state === 'windup' && !e.dead) {
      ctx.strokeStyle = 'rgba(255, 86, 70, ' + (0.35 + Math.sin(e.animT * 26) * 0.25).toFixed(2) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(x, y, e.r + 10, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 食莲人施法：花雾扩散圈
    if (e.state === 'cast' && !e.dead) {
      const k = clamp(e.stateT / 0.55, 0, 1);
      ctx.strokeStyle = 'rgba(168, 230, 160, ' + (0.55 - k * 0.25).toFixed(2) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(x, y, 14 + k * 74, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 独眼巨人冲锋残影
    if (e.state === 'charge' && !e.dead) {
      ctx.fillStyle = 'rgba(190, 180, 160, 0.16)';
      for (let i = 1; i <= 2; i++) {
        ctx.fillRect(
          x - Math.cos(e.chargeAng) * i * 20 - e.w,
          y - Math.sin(e.chargeAng) * i * 20 - e.h,
          e.w * 2, e.h * 2
        );
      }
    }

    ctx.translate(x, y);
    if (e.face === 'left') ctx.scale(-1, 1);
    ctx.scale(SPRITE_SCALE, SPRITE_SCALE);

    if (e.type === 'citizen') drawCitizen(e);
    else if (e.type === 'soldier') drawSoldier(e);
    else if (e.type === 'chariot') drawChariot(e);
    else if (e.type === 'laestrygonian') drawLaestrygonian(e);
    else if (e.type === 'lotus_eater') drawLotusEater(e);
    else if (e.type === 'lotus') drawLotus(e);
    else if (e.type === 'cyclops') drawCyclops(e);
    else drawSkeleton(e, e.type === 'boss' ? 2 : 1);

    ctx.restore();

    // 敌人血条
    if (!e.dead && e.hp < e.maxHp) {
      const bw = e.type === 'chariot' ? 44 : (big ? 40 : 16);
      const bx = x - bw / 2;
      const by = y - (big
        ? (e.type === 'lotus' ? 72 : e.type === 'cyclops' ? 64 : e.type === 'chariot' ? 48 : 46)
        : 30);
      ctx.fillStyle = 'rgba(10,12,18,0.85)';
      ctx.fillRect(bx - 1, by - 1, bw + 2, 4);
      ctx.fillStyle = '#e8483c';
      ctx.fillRect(bx, by, Math.max(1, Math.round(bw * e.hp / e.maxHp)), 2);
    }
  }

    const bone = hit ? '#ffffff' : C.bone;

    ctx.save();
    if (s !== 1) {
      ctx.scale(s, s);
      ctx.translate(0, 1);
    }

    const wind = e.state === 'windup';

    // 深色轮廓：骨白在浅色沙地上也能看清
    ctx.fillStyle = 'rgba(24, 20, 14, 0.5)';
    ctx.fillRect(-4, -12, 8, 7);
    ctx.fillRect(-3, -6, 7, 10);
    ctx.fillRect(-3, 3, 8, 5);

    px(-3, -11, 6, 1, boneD);
    px(-2, -10, 2, 2, '#141822');
    px(2, -10, 1, 2, '#141822');

    px(-2, -6, 4, 1, boneD);

    // 脊椎 + 肋骨
    px(-1, -5, 2, 8, bone);
    px(-3, -4, 6, 1, boneD);
    px(-3, -2, 6, 1, boneD);

    // 手臂
    px(-4, -4, 1, 5, bone);
    px(3, -4, 1, 5, bone);

    px(1, 3, 2, 4, bone);

      px(-1, -16, 2, 2, '#ffcf5c');

  /* =========================================================
     14. 特效 / HUD / 界面
     ========================================================= */
  const vignette = document.createElement('canvas');
  vignette.width = W;
  vignette.height = H;
  (function () {
    const vc = vignette.getContext('2d');
    const g = vc.createRadialGradient(W / 2, H / 2, 90, W / 2, H / 2, 310);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.6, 'rgba(0,0,0,0.12)');
    g.addColorStop(1, 'rgba(0,0,0,0.56)');
    vc.fillStyle = g;
    vc.fillRect(0, 0, W, H);
  })();

  function drawParticles() {
    for (let i = 0; i < game.particles.length; i++) {
      const p = game.particles[i];
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  function drawFloats() {
    for (let i = 0; i < game.floats.length; i++) {
      const f = game.floats[i];
      ctx.globalAlpha = clamp(f.t / f.max * 1.6, 0, 1);
      text(f.text, f.x, f.y, 8, f.color, 'center');
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    // 顶部渐隐遮罩
    const g = ctx.createLinearGradient(0, 0, 0, 48);
    g.addColorStop(0, 'rgba(5,7,12,0.86)');
    g.addColorStop(1, 'rgba(5,7,12,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, 48);

    // 生命：标签宽度随语言变化，格子起点跟着右移，避免中文标签压住血格
    const hpLabelW = text('HP', 16, 12, 8, '#94a7c6');
    const hpX = Math.max(32, Math.round(16 + hpLabelW + 6));
    for (let i = 0; i < player.maxHp; i++) {
      const x = hpX + i * 17;
      if (i < player.hp) {
        px(x, 9, 14, 10, '#e8483c');
        px(x, 9, 14, 3, '#ff8d7c');
        px(x + 2, 12, 3, 2, '#ffb3a7');
      } else {
        px(x, 9, 14, 10, '#272d3d');
        px(x, 9, 14, 1, '#323a4c');
      }
      px(x + 14, 9, 1, 10, '#10141e');
    }

    // 金币：敲碎木桶的收集物
    px(154, 9, 8, 9, '#c9902c');

    const spLabelW = text('SP', 16, 26, 8, '#94a7c6');

    const sw = Math.min(104, 154 - spX - 8);
    px(spX, 26, sw, 5, '#1c2230');
    const ratio = player.stamina / player.maxStamina;
    px(spX, 26, Math.round(sw * ratio), 5, player.blocking ? '#7fd6ff' : '#3d7fa8');
    px(spX, 26, Math.round(sw * ratio), 1, player.blocking ? '#d6f2ff' : '#6fb2da');
    px(spX + sw, 26, 1, 5, '#10141e');

    // 已获得的道具：一排小图标，按拾取顺序排列
    for (let i = 0; i < player.items.length; i++) {
      const ix = 16 + i * 17;
      px(ix - 1, 37, 16, 16, 'rgba(12,16,26,0.78)');
      px(ix - 1, 37, 16, 1, 'rgba(90,110,140,0.55)');
      drawItemIcon(player.items[i], ix + 6, 45, 1);

    // 关卡信息
    text(T('tpl.act', { a: game.level + 1, b: FLOORS.length }), W - 16, 10, 8, '#c7d6ee', 'right');
    let foes = game.pending.length;
    for (let i = 0; i < game.enemies.length; i++) if (!game.enemies[i].dead) foes++;
    text(T('tpl.foes', { n: foes }), W - 16, 24, 8, foes ? '#e8a35c' : '#79d6a0', 'right');

    drawDungeonMap();

    // 底部操作提示（只在前几秒显示）
    if (game.hintT > 0) {
      ctx.globalAlpha = Math.min(1, game.hintT / 1.2) * 0.7;
      const hint = T('tpl.hint', {
        bow: keyName(bindKey('bow')),
        block: keyName(bindKey('block')),
        sword: keyName(bindKey('sword')),
      });

           game.theme === 'shore' ? '#4f4632' : '#93a3bd', 'center');

  // 右上角关卡地图：当前层房间节点 + 连线，已通过 / 当前 / 未探索
  function drawDungeonMap() {
    const mw = 76, mh = 44;
    const mx = W - 16 - mw;
    const my = 38;
    const gap = 20, size = 8;
    const ox = mx + 14;
    const oy = my + 8;
    const nodes = game.mapNodes;

    // 底板与外框
    ctx.fillStyle = 'rgba(7,10,17,0.66)';
    ctx.fillRect(mx - 4, my - 4, mw + 8, mh + 8);
    ctx.fillStyle = 'rgba(22,29,42,0.94)';
    ctx.fillRect(mx, my, mw, mh);
    ctx.strokeStyle = '#46536d';
    ctx.lineWidth = 1;
    ctx.strokeRect(mx + 0.5, my + 0.5, mw - 1, mh - 1);

    // 节点连线
    for (let i = 0; i < nodes.length - 1; i++) {
      const a = nodes[i], b = nodes[i + 1];
      const ax = ox + a[0] * gap + size / 2, ay = oy + a[1] * gap + size / 2;
      const bx = ox + b[0] * gap + size / 2, by = oy + b[1] * gap + size / 2;
      ctx.fillStyle = i < game.roomIndex ? '#56799e' : '#2c3547';
      if (ay === by) ctx.fillRect(Math.min(ax, bx), ay, Math.abs(bx - ax) + 1, 1);
      else ctx.fillRect(ax, Math.min(ay, by), 1, Math.abs(by - ay) + 1);
    }

    // 房间节点
    for (let i = 0; i < nodes.length; i++) {
      const x = ox + nodes[i][0] * gap;
      const y = oy + nodes[i][1] * gap;
      const type = game.rooms[i].type;
      const done = i < game.roomIndex;
      const cur = i === game.roomIndex;

      if (done) {
        ctx.fillStyle = '#4d7196';
        ctx.fillRect(x, y, size, size);
        ctx.fillStyle = '#9dcbf0';
        ctx.fillRect(x + 2, y + 2, 4, 4);
      } else if (cur) {
        const pulse = 0.5 + Math.sin(game.time * 5) * 0.35;
        ctx.fillStyle = '#17324a';
        ctx.fillRect(x, y, size, size);
        ctx.fillStyle = 'rgba(127, 214, 255, ' + pulse.toFixed(2) + ')';
        ctx.fillRect(x, y, size, 1);
        ctx.fillRect(x, y + size - 1, size, 1);
        ctx.fillRect(x, y, 1, size);
        ctx.fillRect(x + size - 1, y, 1, size);
        ctx.fillStyle = '#eaf6ff';
        ctx.fillRect(x + 3, y + 3, 2, 2);
      } else {
        ctx.fillStyle = '#1b2333';
        ctx.fillRect(x, y, size, size);
        ctx.strokeStyle = type === 'boss' ? '#6d3b3b' : '#333e53';
        ctx.strokeRect(x + 0.5, y + 0.5, size - 1, size - 1);
      }
    }
  }

  function drawBow(cx, cy) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-0.3);

    // 弓身：沿弧线摆像素块
    const R = 42;
    for (let i = -20; i <= 20; i++) {
      const ang = i * 0.065;
      const bx = Math.round(Math.cos(ang) * R);
      const by = Math.round(Math.sin(ang) * R);
      px(bx - 1, by - 1, 3, 3, '#b98048');
      if (i % 3 === 0) px(bx - 1, by - 1, 1, 1, '#e0b477');
    }

    // 弓弦与握把
    px(11, -41, 1, 82, '#ddd6c2');
    px(38, -7, 5, 14, '#5f3d22');

    // 箭杆、箭头、尾羽
    px(-42, -1, 84, 2, '#c9b28a');
    px(38, -2, 5, 4, '#cbd6e8');
    px(43, -1, 3, 2, '#cbd6e8');
    px(-45, -3, 4, 2, '#b23b3b');
    px(-45, 1, 4, 2, '#b23b3b');

    // 箭头微光
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(42, 0, 1, 42, 0, 26);
    g.addColorStop(0, 'rgba(255, 210, 130, 0.42)');
    g.addColorStop(1, 'rgba(255, 210, 130, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(16, -26, 52, 52);
    ctx.globalCompositeOperation = 'source-over';

    ctx.restore();
  }

    let y = 58;

  // 按 M 打开的放大地图（游戏暂停）
  function drawBigMap() {
    ctx.fillStyle = 'rgba(5,7,12,0.9)';
    ctx.fillRect(0, 0, W, H);

    text('VOYAGE MAP', W / 2, 24, 15, '#e9effb', 'center');
    text(T('tpl.mapInfo', {
      a: game.level + 1, b: FLOORS.length,
      c: game.roomIndex + 1, d: game.rooms.length,
    }), W / 2, 46, 8, '#7e93b5', 'center');

    const nodes = game.mapNodes;
    const gap = 62, size = 24;
    let maxC = 0, maxR = 0;
    for (let i = 0; i < nodes.length; i++) {
      maxC = Math.max(maxC, nodes[i][0]);
      maxR = Math.max(maxR, nodes[i][1]);
    }
    const ox = Math.round((W - (maxC * gap + size)) / 2);
    const oy = 76;

    // 连线
    for (let i = 0; i < nodes.length - 1; i++) {
      const ax = ox + nodes[i][0] * gap + size / 2;
      const ay = oy + nodes[i][1] * gap + size / 2;
      const bx = ox + nodes[i + 1][0] * gap + size / 2;
      const by = oy + nodes[i + 1][1] * gap + size / 2;
      ctx.fillStyle = i < game.roomIndex ? '#5480aa' : '#2a3346';
      if (ay === by) ctx.fillRect(Math.min(ax, bx), ay - 1, Math.abs(bx - ax), 2);
      else ctx.fillRect(ax - 1, Math.min(ay, by), 2, Math.abs(by - ay));
    }

    // 节点
    for (let i = 0; i < nodes.length; i++) {
      const x = ox + nodes[i][0] * gap;
      const y = oy + nodes[i][1] * gap;
      const room = game.rooms[i];
      const done = i < game.roomIndex;
      const cur = i === game.roomIndex;
      const boss = room.type === 'boss';
      const elite = room.type === 'elite';

      ctx.fillStyle = done ? 'rgba(48, 78, 108, 0.95)' : 'rgba(20, 27, 40, 0.95)';
      ctx.fillRect(x, y, size, size);

      ctx.lineWidth = 1;
      ctx.strokeStyle = done ? '#7fb0dc'
        : (cur ? '#7fd6ff' : (boss ? '#7a3b3b' : (elite ? '#6b5432' : '#333e53')));
      ctx.strokeRect(x + 0.5, y + 0.5, size - 1, size - 1);
      if (elite && !done && !cur) ctx.strokeRect(x + 3.5, y + 3.5, size - 7, size - 7);

      if (cur) {
        const p = 0.35 + Math.sin(game.time * 5) * 0.3;
        ctx.strokeStyle = 'rgba(127, 214, 255, ' + p.toFixed(2) + ')';
        ctx.strokeRect(x - 4.5, y - 4.5, size + 8, size + 8);
      }

      // 房间图标
      const cx = x + size / 2, cy = y + size / 2;
      ctx.globalAlpha = done ? 0.6 : (cur ? 1 : 0.45);
      if (boss) {
        ctx.fillStyle = '#e8dcc0';
        ctx.fillRect(cx - 6, cy - 6, 12, 9);
        ctx.fillStyle = '#151a24';
        ctx.fillRect(cx - 4, cy - 3, 3, 3);
        ctx.fillRect(cx + 1, cy - 3, 3, 3);
        ctx.fillRect(cx - 3, cy + 5, 6, 2);
        ctx.fillStyle = '#e8dcc0';
        ctx.fillRect(cx - 2, cy + 3, 4, 1);
      } else if (elite) {
        ctx.fillStyle = '#f0c070';
        ctx.fillRect(cx - 1, cy - 7, 2, 12);
        ctx.fillRect(cx - 5, cy - 1, 10, 2);
        ctx.fillRect(cx - 4, cy + 4, 8, 2);
      } else if (room.type === 'combat') {
        ctx.fillStyle = '#bcd3ec';
        ctx.fillRect(cx - 1, cy - 6, 2, 10);
        ctx.fillRect(cx - 4, cy - 1, 8, 2);
      } else {
        // 起点：门
        ctx.fillStyle = '#9dcbf0';
        ctx.fillRect(cx - 5, cy - 6, 10, 12);
        ctx.fillStyle = '#151a24';
        ctx.fillRect(cx - 2, cy - 4, 4, 9);
        ctx.fillStyle = '#ffd166';
        ctx.fillRect(cx + 1, cy, 1, 1);
      }
      ctx.globalAlpha = 1;

      text(roomLabel(room.type), x + size / 2, y + size + 5, 7,
        done ? '#6f8aa8' : (cur ? '#cfe7fb' : '#5b6a83'), 'center');
    }

    // 图例
    let lx = W / 2 - 118;
    ctx.fillStyle = '#4d7196';
    ctx.fillRect(lx, 200, 7, 7);
    text('CLEARED', lx + 10, 200, 7, '#7e93b5');
    lx += 62;
    ctx.fillStyle = '#17324a';
    ctx.fillRect(lx, 200, 7, 7);
    ctx.strokeStyle = '#7fd6ff';
    ctx.strokeRect(lx + 0.5, 200.5, 6, 6);
    text('CURRENT', lx + 10, 200, 7, '#7e93b5');
    lx += 66;
    ctx.fillStyle = '#1b2333';
    ctx.fillRect(lx, 200, 7, 7);
    ctx.strokeStyle = '#333e53';
    ctx.strokeRect(lx + 0.5, 200.5, 6, 6);
    text('UNKNOWN', lx + 10, 200, 7, '#7e93b5');

    text('PRESS  M  TO  CLOSE', W / 2, 228, 8, '#93a3bd', 'center');
  }

  function roomLabel(type) {
    if (type === 'start') return 'SHORE';
    if (type === 'elite') return 'TRIAL';
    if (type === 'boss') return 'BOSS';
    return 'AMBUSH';
  }

     15. 渲染

  // 战败过场：城未破，援军已至，只能撤离
  function drawDefeat() {
    const d = game.defeat;
    const age = d.t;
    const fade = clamp(Math.min(age * 2.2, (d.max - age) * 2.2), 0, 1);

    ctx.fillStyle = '#0a0a12';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = fade;

    // 地平线上的火光
    const g = ctx.createLinearGradient(0, 118, 0, 210);
    g.addColorStop(0, 'rgba(180, 70, 30, 0)');
    g.addColorStop(1, 'rgba(200, 80, 30, 0.3)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 118, W, 92);

    // 城池剪影
    ctx.fillStyle = '#241b2a';
    ctx.fillRect(0, 150, W, 60);
    ctx.fillRect(40, 120, 30, 40);
    ctx.fillRect(180, 132, 24, 30);
    ctx.fillRect(330, 126, 28, 36);

    // 墙顶火光边
    ctx.fillStyle = '#3d2a2c';
    for (let x = 0; x < W; x += 16) ctx.fillRect(x, 146, 8, 2);
    // 塔楼窗口
    ctx.fillStyle = '#c8552a';
    ctx.fillRect(52, 132, 3, 4);
    ctx.fillRect(190, 142, 3, 4);
    ctx.fillRect(340, 138, 3, 4);
    // 城墙脚下的火光反射
    ctx.fillStyle = 'rgba(170, 65, 25, 0.2)';
    ctx.fillRect(0, 204, W, 6);

    // 城墙后推进的火把与长矛
    for (let i = 0; i < 28; i++) {
      const h = hash(i * 7, 3);
      const x = 10 + h * (W - 20);
      const rise = (age * 16 + i * 3) % 32;
      const y = 150 - rise;
      ctx.fillStyle = 'rgba(200, 190, 160, 0.45)';
      ctx.fillRect(x, y - 18, 1, 20);
      ctx.fillStyle = i % 3 === 0 ? '#ffb545' : '#ff8a2b';
      ctx.fillRect(x - 1, y - 22, 2, 2);
    }

    // 海面与撤离的小船
    const seaY = 210;
    ctx.fillStyle = '#0b1a2b';
    ctx.fillRect(0, seaY, W, H - seaY);
    drawWave(seaY + 6, 4, '#142b42', 1.6, 0.042);
    drawWave(seaY + 18, 6, '#1b3b58', 2.6, 0.058);
    drawBoat(W * 0.5 + 50 + age * 9, seaY + 28 + Math.sin(age * 2.2) * 3);

    // 文字
    text('THE CITY HOLDS', W / 2, 38, 18, '#e8a35c', 'center');
    text('DAWN BRINGS THEIR ARMIES', W / 2, 68, 8, '#9db0cd', 'center');
    text('WE LEAVE ISMARUS WITH SIX MEN LESS', W / 2, 86, 8, '#8ba0be', 'center');

    ctx.globalAlpha = 1;
  }

  // 幕间过场：月夜航行
  function drawSail() {
    const tr = game.transition;
    const age = tr.t;
    const fade = clamp(Math.min(age * 2.6, (tr.max - age) * 2.6), 0, 1);

    // 夜空
    ctx.fillStyle = '#070b13';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = fade;

    // 星星
    for (let i = 0; i < 46; i++) {
      const sx = (hash(i * 13, 7) * W) | 0;
      const sy = (hash(i * 7, 3) * 150) | 0;
      const tw = 0.3 + Math.abs(Math.sin(game.time * 1.4 + i)) * 0.6;
      ctx.fillStyle = 'rgba(200, 220, 255, ' + tw.toFixed(2) + ')';
      ctx.fillRect(sx, sy, 1, 1);
    }

    // 弯月
    ctx.fillStyle = '#e6ddc2';
    ctx.beginPath();
    ctx.arc(W - 74, 54, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#070b13';
    ctx.beginPath();
    ctx.arc(W - 68, 48, 15, 0, Math.PI * 2);
    ctx.fill();

    // 海面
    const seaY = 178;
    ctx.fillStyle = '#0b1a2b';
    ctx.fillRect(0, seaY + 10, W, H - seaY - 10);
    drawWave(seaY + 8, 4, '#142b42', 1.6, 0.042);
    drawWave(seaY + 22, 6, '#1b3b58', 2.6, 0.058);

    // 小船
    drawBoat(W * 0.5 + Math.sin(age * 0.8) * 10, seaY + 30 + Math.sin(age * 2.2) * 3);

    // 幕名
    text(T('tpl.actBanner', { n: ['I', 'II', 'III'][tr.next] }), W / 2, 58, 18, '#e9effb', 'center');
    text(FLOORS[tr.next].name, W / 2, 86, 9, '#8ba0be', 'center');
    text('SAILING', W / 2, 104, 7, '#5f7192', 'center');

    ctx.globalAlpha = 1;
  }

  function drawWave(baseY, amp, color, speed, freq) {
    ctx.fillStyle = color;
    for (let x = 0; x < W; x += 2) {
      const y = Math.round(baseY + Math.sin(x * freq + game.time * speed) * amp);
      ctx.fillRect(x, y, 2, H - y);
    }
    // 波峰高光
    ctx.fillStyle = 'rgba(160, 200, 235, 0.12)';
    for (let x = 0; x < W; x += 2) {
      const y = Math.round(baseY + Math.sin(x * freq + game.time * speed) * amp);
      ctx.fillRect(x, y, 2, 1);
    }
  }

  function drawBoat(cx, cy) {
    cx = Math.round(cx);
    cy = Math.round(cy);

    // 船体
    px(cx - 16, cy, 32, 4, '#5a3a22');
    px(cx - 12, cy + 4, 24, 3, '#3e2817');
    px(cx - 18, cy - 3, 4, 4, '#5a3a22');
    px(cx + 14, cy - 3, 4, 4, '#5a3a22');

    // 桅杆与帆
    px(cx - 1, cy - 26, 2, 26, '#6b4a2a');
    px(cx + 1, cy - 24, 13, 18, '#ddd6c2');
    px(cx + 1, cy - 24, 3, 18, '#b8b2a0');
    px(cx + 1, cy - 6, 13, 2, '#a8a292');

    // 船旗
    px(cx - 5, cy - 26, 4, 3, '#b23b3b');
  }

  function render() {
    ctx.setTransform(RS, 0, 0, RS, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    if (game.mode === 'sail') {
      drawSail();
      return;
    }

    if (game.mode === 'defeat') {
      drawDefeat();
      return;
    }

    ctx.fillStyle = '#0a0d14';
    ctx.fillRect(0, 0, W, H);

    // 镜头震动
    if (game.shake > 0.04) {
      ctx.translate(Math.round(rand(-game.shake, game.shake)), Math.round(rand(-game.shake, game.shake)));
    }

    drawRoom();
    if (game.entryDir) drawDoor(game.entryDir, false);
    if (game.exitDir) drawDoor(game.exitDir, game.doorOpen);

    drawPickups();

    // 按 y 排序绘制，制造前后遮挡
    const list = [];
    for (let i = 0; i < game.barrels.length; i++) {
      const b = game.barrels[i];
      if (!b.broken) (function (bb) { list.push({ y: bb.y, fn: function () { drawBarrel(bb); } }); })(b);
    }
    if (game.reward) list.push({ y: game.reward.y, fn: drawReward });
    for (let i = 0; i < game.enemies.length; i++) {
      (function (e) { list.push({ y: e.y, fn: function () { drawEnemy(e); } }); })(game.enemies[i]);
    }
    list.push({ y: player.y, fn: drawHero });
    list.sort(function (a, b) { return a.y - b.y; });
    for (let i = 0; i < list.length; i++) list[i].fn();

    drawSwing();
    drawArrows();
    drawParticles();
    drawFloats();

    // 光照与暗角：室外更明亮，洞窟保持昏暗
    ctx.globalAlpha = game.theme === 'cave' ? 1 : (game.theme === 'cliff' ? 0.62 : 0.42);
    ctx.drawImage(vignette, 0, 0);
    ctx.globalAlpha = 1;

    // 受伤红闪
    if (game.hurtFlash > 0) {
      ctx.fillStyle = 'rgba(200, 30, 40, ' + (game.hurtFlash * 0.5).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    ctx.setTransform(RS, 0, 0, RS, 0, 0);

    const overlay = game.mode === 'title' || game.mode === 'map' || game.mode === 'settings';
    if (!overlay) drawHUD();
    drawIntro();
    if (game.itemBanner) drawItemBanner();
    if (game.mode !== 'map' && game.mode !== 'settings') drawBanner();

    // 转场黑幕
    if (game.fade > 0) {
      ctx.fillStyle = 'rgba(4,6,10,' + clamp(game.fade, 0, 1).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    if (game.mode === 'title') drawTitle();
    else if (game.mode === 'dead') drawEndScreen(false);
    else if (game.mode === 'win') drawEndScreen(true);
    else if (game.mode === 'paused') drawPaused();
    else if (game.mode === 'map') drawBigMap();
    else if (game.mode === 'settings') drawSettings();
  }

  /* =========================================================
     16. 主循环
     ========================================================= */
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
